<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="format-detection" content="telephone=no">
    <title>口算小游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-touch-callout: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            overscroll-behavior: none;
            touch-action: none;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
        }

        h1 {
            color: white;
            font-size: 1.8rem;
            margin: 10px 0 8px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
        }

        .class-name {
            color: #ffd700;
            font-size: 1.3rem;
            margin-bottom: 15px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        .info-text {
            color: rgba(255,255,255,0.9);
            font-size: 0.95rem;
            margin: 4px 0;
        }

        .btn-primary {
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            color: #333;
            font-size: 1.1rem;
            padding: 12px 40px;
            border-radius: 10px;
            margin-top: 20px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            border: none;
            cursor: pointer;
        }

        .question {
            font-size: 38px;
            text-align: center;
            margin: 15px 0;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
        }

        .answer-input {
            display: block;
            width: 70%;
            max-width: 300px;
            height: 55px;
            margin: 10px auto;
            padding: 0 15px;
            background: white;
            border: 2px solid #ddd;
            border-radius: 10px;
            text-align: center;
            font-size: 26px;
            font-weight: bold;
        }

        .keyboard {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 280px;
            margin-top: 10px;
        }

        .btn {
            width: 55px;
            height: 50px;
            margin: 4px;
            background: #409eff;
            color: white;
            font-weight: bold;
            border-radius: 8px;
            border: none;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.15s;
        }

        .btn:active {
            transform: scale(0.95);
            opacity: 0.9;
        }

        .btn-big {
            width: 120px;
        }

        .timer {
            font-size: 2.8rem;
            color: #ffd700;
            font-weight: bold;
            margin: 8px 0;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        .timer.warning {
            color: #ff9900;
        }

        .timer.danger {
            color: #ff4444;
            animation: pulse 0.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .progress {
            font-size: 0.95rem;
            color: rgba(255,255,255,0.8);
            margin: 5px 0;
        }

        .score-display {
            font-size: 3.5rem;
            color: #ffd700;
            font-weight: bold;
            margin: 10px 0;
            text-shadow: 0 2px 15px rgba(0,0,0,0.3);
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin: 15px 0;
        }

        .stat {
            text-align: center;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: bold;
            color: white;
        }

        .stat-label {
            font-size: 0.8rem;
            color: rgba(255,255,255,0.7);
        }

        .result-message {
            font-size: 1.1rem;
            color: white;
            margin: 10px 0;
        }

        /* 页面切换 */
        .page {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .page.active {
            display: flex;
        }

        .feedback {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2rem;
            font-weight: bold;
            padding: 20px 40px;
            border-radius: 15px;
            z-index: 100;
            animation: feedbackPop 0.8s forwards;
        }

        .feedback.right {
            background: rgba(76, 175, 80, 0.95);
            color: white;
        }

        .feedback.wrong {
            background: rgba(244, 67, 54, 0.95);
            color: white;
        }

        @keyframes feedbackPop {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
            20% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
            40% { transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(1); }
        }
    </style>
</head>
<body>
    <!-- 开始页面 -->
    <div class="page active" id="startPage">
        <h1>🧮 口算练习</h1>
        <div class="class-name">一年级20班</div>
        <p class="info-text">随机10道20以内加减法</p>
        <p class="info-text">⏱️ 限时60秒</p>
        <p class="info-text">✅ 正确率 + 速度 = 高分</p>
        <button class="btn-primary" id="startBtn">开始挑战</button>
    </div>

    <!-- 游戏页面 -->
    <div class="page" id="gamePage">
        <div class="timer" id="timer">60</div>
        <div class="progress" id="progress">第 1/10 题</div>
        <div class="question" id="question">1 + 1 = ?</div>
        <input type="text" class="answer-input" id="answer" readonly placeholder="?">
        <div class="keyboard">
            <button class="btn">1</button>
            <button class="btn">2</button>
            <button class="btn">3</button>
            <button class="btn">4</button>
            <button class="btn">5</button>
            <button class="btn">6</button>
            <button class="btn">7</button>
            <button class="btn">8</button>
            <button class="btn">9</button>
            <button class="btn" id="delBtn">←</button>
            <button class="btn">0</button>
            <button class="btn btn-big" id="okBtn">确定</button>
        </div>
    </div>

    <!-- 结果页面 -->
    <div class="page" id="endPage">
        <h1>挑战完成！</h1>
        <div class="result-message" id="resultMessage"></div>
        <div class="score-display" id="finalScore">0</div>
        <p class="info-text">你的得分</p>
        <div class="stats">
            <div class="stat">
                <div class="stat-value" id="correctCount">0</div>
                <div class="stat-label">正确</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="wrongCount">0</div>
                <div class="stat-label">错误</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="timeUsed">0</div>
                <div class="stat-label">用时(秒)</div>
            </div>
        </div>
        <button class="btn-primary" id="restartBtn">再来一次</button>
    </div>

    <!-- 音效 -->
    <audio id="soundRight" preload="auto">
        <source src="data:audio/wav;base64,UklGRl9vT19teleQACAmAGF0Y29tb25zdGVyAFVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVV">
    </audio>
    <audio id="soundWrong" preload="auto">
        <source src="data:audio/wav;base64,UklGRl9vT19teleQAAAmAGF0Y29tb25zdGVyAFVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVV">
    </audio>

    <script>
        let questions = [];
        let currentIndex = 0;
        let correctCount = 0;
        let wrongCount = 0;
        let timeLeft = 60;
        let startTime = 0;
        let timerInterval = null;

        function vibrateShort() {
            if (navigator.vibrate) navigator.vibrate(50);
        }

        function vibrateLong() {
            if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
        }

        function playSound(type) {
            try {
                const audio = document.getElementById(type === 'right' ? 'soundRight' : 'soundWrong');
                audio.currentTime = 0;
                audio.play().catch(() => {});
            } catch(e) {}
        }

        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
        }

        function generateQuestions() {
            questions = [];
            for (let i = 0; i < 10; i++) {
                const isAddition = Math.random() > 0.5;
                // 70%概率出10以上的数，30%概率出10以内的数
                const useLargeNumbers = Math.random() > 0.3;
                let a, b, answer;
                
                if (isAddition) {
                    if (useLargeNumbers) {
                        // 至少有一个数 > 10，确保和<=20
                        a = Math.floor(Math.random() * 11) + 10; // 10-20
                        a = Math.min(a, 20);
                        b = Math.floor(Math.random() * (21 - a));
                        // 确保b不是0
                        if (b === 0) b = Math.floor(Math.random() * Math.min(10, 21 - a)) + 1;
                    } else {
                        // 10以内，禁止0
                        a = Math.floor(Math.random() * 9) + 1; // 1-9
                        b = Math.floor(Math.random() * (10 - a)) + 1; // 1-9，确保和<=10
                    }
                    answer = a + b;
                } else {
                    if (useLargeNumbers) {
                        // 至少有一个数 > 10
                        a = Math.floor(Math.random() * 11) + 10; // 10-20
                        b = Math.floor(Math.random() * a);
                        // 确保b不是0，且结果>=0
                        if (b === 0) b = Math.floor(Math.random() * Math.min(9, a)) + 1;
                    } else {
                        // 10以内，禁止0
                        a = Math.floor(Math.random() * 9) + 1; // 1-9
                        b = Math.floor(Math.random() * a) + 1; // 1-a，确保结果>=0
                    }
                    answer = a - b;
                }
                questions.push({ text: `${a} ${isAddition ? '+' : '-'} ${b} = ?`, answer: answer });
            }
        }

        function startGame() {
            currentIndex = 0;
            correctCount = 0;
            wrongCount = 0;
            timeLeft = 60;
            startTime = Date.now();
            generateQuestions();
            showPage('gamePage');
            showQuestion();
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                const timerEl = document.getElementById('timer');
                timerEl.textContent = timeLeft;
                if (timeLeft <= 10) timerEl.className = 'timer danger';
                else if (timeLeft <= 20) timerEl.className = 'timer warning';
                if (timeLeft <= 0) endGame();
            }, 1000);
        }

        function showQuestion() {
            const q = questions[currentIndex];
            document.getElementById('question').textContent = q.text;
            document.getElementById('progress').textContent = `第 ${currentIndex + 1}/10 题`;
            document.getElementById('answer').value = '';
        }

        function showFeedback(isCorrect) {
            const feedback = document.createElement('div');
            feedback.className = `feedback ${isCorrect ? 'right' : 'wrong'}`;
            feedback.textContent = isCorrect ? '✅' : '❌';
            document.body.appendChild(feedback);
            if (isCorrect) {
                vibrateShort();
                playSound('right');
            } else {
                vibrateLong();
                playSound('wrong');
            }
            setTimeout(() => feedback.remove(), 800);
        }

        function submitAnswer() {
            const input = document.getElementById('answer');
            const userAnswer = parseInt(input.value);
            if (isNaN(userAnswer)) return;
            if (userAnswer === questions[currentIndex].answer) {
                correctCount++;
                showFeedback(true);
            } else {
                wrongCount++;
                showFeedback(false);
            }
            currentIndex++;
            if (currentIndex >= 10) {
                setTimeout(endGame, 500);
            } else {
                showQuestion();
            }
        }

        function endGame() {
            clearInterval(timerInterval);
            const timeUsed = Math.round((Date.now() - startTime) / 1000);
            const score = Math.round(correctCount * 10 + Math.max(0, 60 - timeUsed) * 0.5);
            let message = '';
            if (correctCount === 10) message = '🎉 满分！';
            else if (correctCount >= 8) message = '👏 非常棒！';
            else if (correctCount >= 6) message = '💪 不错！';
            else message = '📚 继续加油！';
            document.getElementById('finalScore').textContent = score;
            document.getElementById('correctCount').textContent = correctCount;
            document.getElementById('wrongCount').textContent = wrongCount;
            document.getElementById('timeUsed').textContent = timeUsed;
            document.getElementById('resultMessage').textContent = message;
            showPage('endPage');
        }

        // 数字键盘
        const input = document.getElementById('answer');
        document.querySelectorAll('.keyboard .btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const t = btn.textContent.trim();
                if (t === '←') {
                    input.value = input.value.slice(0, -1);
                } else if (t === '确定') {
                    submitAnswer();
                } else {
                    if (input.value.length < 3) input.value += t;
                }
            });
        });

        document.getElementById('startBtn').addEventListener('click', startGame);
        document.getElementById('restartBtn').addEventListener('click', () => showPage('startPage'));

        // 全屏
        document.addEventListener('DOMContentLoaded', () => {
            document.addEventListener('click', () => {
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen().catch(() => {});
                }
            }, { once: true });
        });
    </script>
</body>
</html>
