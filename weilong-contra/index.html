<!doctype html>
<html lang="zh-CN">

<title>威龙突袭 · 三角洲行动 魂斗罗 Demo</title>
<style>
  /* v2 优化日志 */
  /*
   * P0-1：新增 WebAudio 程序化射击、爆炸、受伤、跳跃、拾取、Boss 受击及胜负旋律。
   * P0-2：新增关卡/Boss 两套 8-bit 循环 BGM，并与开始、暂停、胜负状态联动。
   * P0-3：新增步枪、散弹枪 S、机枪 M、激光 L，含差异化弹道、伤害、射速与掉落。
   * P0-4：新增血包和 8 秒无敌星，所有道具使用像素风程序化绘制与浮空动画。
   * P0-5：新增 localStorage 最高分读取、展示和静默容错更新。
   * P0-6：Boss 血量提升至 150，新增 WARNING、地面激光、Boss BGM、大爆炸与慢动作。
   * P1-1：敌人 30% 掉血包，HUD 显示武器，得分增加时短暂放大。
   */
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    position:fixed; inset:0; width:100%; height:100%; background:#0a0d12; overflow:hidden;
    overscroll-behavior:none; -webkit-user-select:none; user-select:none; touch-action:none;
    -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none;
  }
  #wrap {
    width:100%; height:100%; display:flex; align-items:center; justify-content:center;
  }
  canvas {
    image-rendering: pixelated; image-rendering: crisp-edges;
    background:#10141c; max-width:100%; max-height:100%;
    box-shadow:0 0 40px rgba(0,0,0,.6);
  }
  #hint {
    position:fixed; left:50%; bottom:10px; transform:translateX(-50%);
    color:#5c6b7a; font-size:12px; letter-spacing:.5px; pointer-events:none;
    text-align:center; max-width:94vw;
  }
  /* 触屏控制 */
  #touch { position:fixed; inset:0; z-index:10; display:none; pointer-events:none; }
  #touch.show { display:block; }
  #touch .dpad {
    position:absolute;
    left: calc(34px + env(safe-area-inset-left));
    bottom: calc(22px + env(safe-area-inset-bottom));

  #touch .dpad .up{grid-area:1/2;} #touch .dpad .left{grid-area:2/1;}
  #touch .dpad .right{grid-area:2/3;} #touch .dpad .down{grid-area:3/2;}

  #touch button {

    touch-action:none; -webkit-tap-highlight-color:transparent; user-select:none;
  }
  #touch .acts button { width:70px; height:70px; font-size:20px; }
  #touch button:active { background:rgba(84,214,230,.45); border-color:#54d6e6; }
  #rotate {
    position:fixed; inset:0; z-index:30; display:none; flex-direction:column; align-items:center; justify-content:center;
    background:#0a0d12; color:#cfd8e3; font-size:16px; text-align:center; padding:24px;
  }
  #rotate .big { font-size:52px; color:#54d6e6; margin-bottom:14px; animation:rot 1.6s ease-in-out infinite; }
  #rotate .go { margin-top:18px; padding:10px 22px; border:2px solid #54d6e6; border-radius:10px; color:#54d6e6; font-weight:700; }
  @keyframes rot { 0%,100%{transform:rotate(-90deg)} 50%{transform:rotate(0deg)} }
  @media (orientation:portrait) and (max-width:760px){ #rotate{ display:flex; } }

<body>
<div id="wrap"><canvas id="game" width="960" height="540"></canvas></div>
<div id="touch">
  <div class="dpad">
    <button class="up" data-k="up">▲</button>
    <button class="left" data-k="left">◀</button>

    <button data-k="jump">跳</button>
    <button data-k="shoot">射</button>
  </div>
</div>
<div id="rotate">
  <div class="big">▭</div>
  请旋转手机至横屏以获得最佳体验<br/>并点击下方按钮进入全屏模式<br/>
  <div class="go" id="rotGo">↻ 进入全屏横屏</div>
</div>
<div id="hint">移动 A/D · 跳跃 W/空格 · 瞄准 W/S 组合方向 · 射击 J · 暂停 P · 重开 R</div>
<script>
"use strict";
/* =========================================================================
   威龙突袭 —— 魂斗罗风格单关卡 Demo
   - 玩家：威龙（三角洲行动战术突击兵）
   - Boss：典狱长
   精灵图系统：优先加载 assets/weilong.png / assets/warden.png，
   若不存在则使用内置程序化像素角色。两者共用同一套网格规格。
   ========================================================================= */

const VW = 960, VH = 540;
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;

/* 自适应缩放（保持像素感） */
function resize(){
  const s = Math.min(window.innerWidth / VW, window.innerHeight / VH);
  cv.style.width  = (VW * s) + 'px';
  cv.style.height = (VH * s) + 'px';
}
window.addEventListener('resize', resize); resize();

/* ---------------------------- 精灵图表规格 ---------------------------- */
/* 网格：行=动画类型，列=该动画的帧。优先按图片实际尺寸推算行列。
   weilong: fw/fh=64, 行: idle(2) run(6) jump(2) shoot(2)
   warden : fw/fh=128,行: idle(2) atk1(2) atk2(2) hurt(1)                */
const SPRITE_CFG = {
  weilong: {
    src: 'assets/weilong.png',
    fw: 64, fh: 64,
    anims: { idle:{row:0,frames:2}, run:{row:1,frames:6}, jump:{row:2,frames:2}, shoot:{row:3,frames:2} }
  },
  warden: {
    src: 'assets/warden.png',
    fw: 128, fh: 128,
    anims: { idle:{row:0,frames:2}, atk1:{row:1,frames:2}, atk2:{row:2,frames:2}, hurt:{row:3,frames:1} }
  }
};

const sheets = {}; // runtime: { weilong:{src,fw,fh,cols,rows,anims}, ... }

/* 程序化兜底：把角色画进离屏 canvas 网格 */
function genProcedural(cfg, drawFn){
  const rows = Math.max(...Object.values(cfg.anims).map(a=>a.row)) + 1;
  const cols = Math.max(...Object.values(cfg.anims).map(a=>a.frames));
  const c = document.createElement('canvas');
  c.width = cols * cfg.fw; c.height = rows * cfg.fh;
  const g = c.getContext('2d'); g.imageSmoothingEnabled = false;
  for (const name in cfg.anims){
    const a = cfg.anims[name];
    for (let f=0; f<a.frames; f++){
      drawFn(g, f, name, a.row * cfg.fh, a.frames);
    }
  }
  return { src:c, fw:cfg.fw, fh:cfg.fh, cols, rows, anims:cfg.anims };
}

/* 加载：有图用图，无图用程序化 */
function loadSheet(key){
  return new Promise(res=>{
    const cfg = SPRITE_CFG[key];
    if (cfg.src){
      const img = new Image();
      img.onload = ()=> res({ src:img, fw:cfg.fw, fh:cfg.fh,
        cols:Math.round(img.naturalWidth/cfg.fw), rows:Math.round(img.naturalHeight/cfg.fh), anims:cfg.anims });
      img.onerror = ()=> res(genProcedural(cfg, key==='weilong'?drawWeilong:drawWarden));
      img.src = cfg.src;
    } else {
      res(genProcedural(cfg, key==='weilong'?drawWeilong:drawWarden));
    }
  });
}

/* 取某动画第 f 帧的绘制信息 */
function frameRect(sheet, anim, f){
  const a = sheet.anims[anim]; if(!a) return null;
  const col = f % a.frames;
  return { sx: col*sheet.fw, sy: a.row*sheet.fh, sw: sheet.fw, sh: sheet.fh };
}

/* =========================================================================
   程序化像素角色绘制（兜底用，同时定义 AI 图应匹配的姿态）
   ========================================================================= */
function px(g, x, y, w, h, color){ g.fillStyle=color; g.fillRect(x|0, y|0, w|0, h|0); }
function limb(g, x1,y1,x2,y2,w,color){
  const dx=x2-x1, dy=y2-y1, len=Math.hypot(dx,dy), ang=Math.atan2(dy,dx);
  g.save(); g.translate(x1,y1); g.rotate(ang); g.fillStyle=color;
  g.fillRect(-w/2, -w/2, len+w, w); g.restore();
}

const WL = {
  helmet:'#23262b', helmetTop:'#15171a', skin:'#e3a877', goggles:'#16242b', lens:'#54d6e6',
  vest:'#4d5d39', vestDark:'#3a4729', shirt:'#6f7d4d', pants:'#33371f', boot:'#1b1b1b',
  rifle:'#202020', rifleHi:'#3a3a3a', gold:'#caa53a'
};

function drawWeilong(g, fi, anim, rowY, frames){
  const ox = fi * 64, oy = rowY; // 每帧 64x64
  const cx = ox + 32, footY = oy + 60;
  let swing=0, crouch=0, bob=0, muzzle=0, armFwd=14, armY=0;
  if (anim==='idle'){ bob = fi?1:0; swing=0; }
  else if (anim==='run'){ const a=(fi/frames)*Math.PI*2; swing=Math.sin(a)*7; bob=Math.abs(Math.cos(a))*1.5; }
  else if (anim==='jump'){ swing = fi?7:-7; crouch=5; armFwd=12; }
  else if (anim==='shoot'){ muzzle = fi?1:0; armFwd=18; armY=-2; }

  const hipY = footY - 24 - crouch;
  const shY  = hipY - 16;
  const headY= shY - 12;

  // 腿
  const foot1x = cx - 5 + swing, foot2x = cx + 5 - swing;
  limb(g, cx, hipY, foot1x, footY, 7, WL.pants);
  limb(g, cx, hipY, foot2x, footY, 7, WL.pants);
  px(g, foot1x-4, footY-2, 9, 4, WL.boot);
  px(g, foot2x-4, footY-2, 9, 4, WL.boot);
  // 躯干（战术背心）
  px(g, cx-8, shY, 16, hipY-shY+4, WL.vest);
  px(g, cx-8, shY, 16, 3, WL.vestDark);
  px(g, cx-2, shY+4, 4, hipY-shY, WL.vestDark); // 弹匣包中线
  px(g, cx-8, hipY-3, 16, 3, WL.shirt);
  // 头 + 头盔
  px(g, cx-6, headY-2, 12, 12, WL.skin);
  px(g, cx-7, headY-6, 14, 7, WL.helmet);
  px(g, cx-7, headY-8, 14, 3, WL.helmetTop);
  px(g, cx-7, headY, 14, 2, WL.goggles);     // 护目镜带
  px(g, cx-1, headY+1, 4, 3, WL.lens);       // 镜片反光
  // 后臂
  limb(g, cx-4, shY+2, cx-9, shY+12, 5, WL.shirt);
  // 前臂 + 步枪
  const handX = cx + armFwd, handY = shY + 6 + armY;
  limb(g, cx+2, shY+3, handX, handY, 5, WL.vest);
  px(g, handX, handY-2, 22, 4, WL.rifle);     // 枪身
  px(g, handX+18, handY-3, 5, 6, WL.rifleHi); // 枪口
  px(g, handX-2, handY+2, 5, 6, WL.rifle);    // 弹匣
  if (muzzle){ px(g, handX+23, handY-3, 5, 8, '#ffd76b'); px(g, handX+27, handY-1, 4, 4, '#ff8a3b'); }
  // ground shadow
  px(g, cx-9, footY+1, 18, 2, 'rgba(0,0,0,.25)');
}

const WD = {
  armor:'#39404c', armorDark:'#262b34', trim:'#a32020', trimHi:'#d23b3b',
  mask:'#15171c', eye:'#ff3b30', eyeGlow:'#ff7a5c', cannon:'#15171c', cannonHi:'#3a3f4a',
  skin:'#caa07a', metal:'#4a505c'
};

function drawWarden(g, fi, anim, rowY, frames){
  const ox = fi * 128, oy = rowY; // 每帧 128x128
  const cx = ox + 64, footY = oy + 120;
  let armRaise=0, glow=0, muzzle=0;
  if (anim==='idle'){ glow = fi?1:0; }
  else if (anim==='atk1'){ armRaise = fi?10:4; muzzle = fi?1:0; }
  else if (anim==='atk2'){ armRaise = fi?-6:2; }
  else if (anim==='hurt'){ glow=0; }

  const hipY = footY - 52;
  const shY  = hipY - 34;
  const headY= shY - 22;

  // 腿（重甲）
  limb(g, cx-12, hipY, cx-16, footY, 13, WD.armorDark);
  limb(g, cx+12, hipY, cx+16, footY, 13, WD.armorDark);
  px(g, cx-24, footY-6, 20, 8, WD.armor);
  px(g, cx+6,  footY-6, 20, 8, WD.armor);
  // 躯干（厚重胸甲）
  px(g, cx-22, shY, 44, hipY-shY+6, WD.armor);
  px(g, cx-22, shY, 44, 8, WD.armorDark);
  px(g, cx-10, shY+10, 20, hipY-shY-6, WD.trim);      // 红色核心
  px(g, cx-4,  shY+12, 8, 14, WD.trimHi);
  // 肩甲
  px(g, cx-34, shY-4, 18, 16, WD.armorDark);
  px(g, cx+16, shY-4, 18, 16, WD.armorDark);
  px(g, cx-34, shY-4, 18, 4, WD.trim);
  px(g, cx+16, shY-4, 18, 4, WD.trim);
  // 头（面具 + 发光眼）
  px(g, cx-12, headY-6, 24, 24, WD.mask);
  px(g, cx-14, headY-10, 28, 8, WD.armorDark);  // 头盔顶
  px(g, cx-9,  headY+2, 7, 5, WD.eye);
  px(g, cx+2,  headY+2, 7, 5, WD.eye);
  if (glow){ px(g, cx-10, headY, 10, 9, WD.eyeGlow); px(g, cx+1, headY, 10, 9, WD.eyeGlow); }
  // 双臂 + 双肩炮
  const armY = shY + 6 - armRaise;
  limb(g, cx-26, shY, cx-30, armY+16, 10, WD.armor);
  limb(g, cx+26, shY, cx+30, armY+16, 10, WD.armor);
  px(g, cx-40, armY+8, 14, 12, WD.cannon);   // 左炮
  px(g, cx+26, armY+8, 14, 12, WD.cannon);   // 右炮
  px(g, cx-40, armY+8, 14, 3, WD.cannonHi);
  px(g, cx+26, armY+8, 14, 3, WD.cannonHi);
  if (muzzle){ px(g, cx-44, armY+9, 6, 10, '#ffd76b'); px(g, cx+38, armY+9, 6, 10, '#ffd76b'); }
  px(g, cx-30, footY+2, 60, 3, 'rgba(0,0,0,.3)');
}

/* =========================================================================
   WebAudio 程序化音频（创建失败时静默降级）
   ========================================================================= */
const SFX = {
  ctx:null, master:null, noiseBuffer:null, disabled:false,
  counts:{ shoot:0, explosion:0, hurt:0, jump:0, pickup:0, bossHit:0, win:0, lose:0 },
  init(){
    if (this.disabled) return null;
    try{
      if (!this.ctx){
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx){ this.disabled=true; return null; }
        this.ctx = new AudioCtx();
        this.master = this.ctx.createGain();
        this.master.gain.value = 0.2;
        this.master.connect(this.ctx.destination);
        const len = Math.max(1, Math.floor(this.ctx.sampleRate*0.45));
        this.noiseBuffer = this.ctx.createBuffer(1,len,this.ctx.sampleRate);
        const data=this.noiseBuffer.getChannelData(0);
        for(let i=0;i<len;i++) data[i]=Math.random()*2-1;
      }
      if (this.ctx.state==='suspended') this.ctx.resume().catch(()=>{});
      return this.ctx;
    }catch(e){ this.disabled=true; return null; }
  },
  count(name){ this.counts[name]=(this.counts[name]||0)+1; },
  tone(from,to,dur,type='square',vol=0.2,delay=0){
    const ac=this.init(); if(!ac||!this.master) return;
    try{
      const t=ac.currentTime+delay, o=ac.createOscillator(), g=ac.createGain();
      o.type=type; o.frequency.setValueAtTime(Math.max(20,from),t);
      o.frequency.exponentialRampToValueAtTime(Math.max(20,to),t+dur);
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.006);
      g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      o.connect(g); g.connect(this.master); o.start(t); o.stop(t+dur+0.02);
    }catch(e){}
  },
  noise(dur=0.2,vol=0.2,delay=0){
    const ac=this.init(); if(!ac||!this.master||!this.noiseBuffer) return;
    try{
      const t=ac.currentTime+delay, s=ac.createBufferSource(), f=ac.createBiquadFilter(), g=ac.createGain();
      s.buffer=this.noiseBuffer; f.type='lowpass'; f.frequency.setValueAtTime(2400,t);
      f.frequency.exponentialRampToValueAtTime(120,t+dur);
      g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      s.connect(f); f.connect(g); g.connect(this.master); s.start(t); s.stop(t+dur+0.02);
    }catch(e){}
  },
  shoot(){ this.count('shoot'); this.tone(1200,620,0.06,'square',0.08); },
  enemyExplosion(){ this.count('explosion'); this.noise(0.3,0.34); this.tone(150,48,0.3,'sawtooth',0.22); },
  playerHurt(){ this.count('hurt'); this.tone(180,55,0.4,'square',0.32); },
  jump(){ this.count('jump'); this.tone(260,520,0.11,'square',0.12); },
  pickup(){ this.count('pickup'); this.tone(660,880,0.12,'square',0.19); this.tone(880,1320,0.14,'square',0.16,0.1); },
  bossHit(){ this.count('bossHit'); this.tone(920,210,0.1,'square',0.18); this.noise(0.08,0.08); },
  win(){ this.count('win'); [523,659,784,1047].forEach((n,i)=>this.tone(n,n*1.01,0.2,'square',0.2,i*0.14)); },
  lose(){ this.count('lose'); [330,247,196,131].forEach((n,i)=>this.tone(n,n*0.8,0.28,'triangle',0.22,i*0.18)); }
};

const BGM = {
  timer:null, gain:null, mode:null, step:0, nextTime:0,
  melodies:{
    level:[220,277,330,277,220,294,349,294,196,247,330,247,185,220,277,220],
    boss:[110,110,147,165,110,196,175,147,98,98,147,165,196,175,147,123]
  },
  start(mode='level'){
    if (this.timer && this.mode===mode) return;
    this.stop();
    const ac=SFX.init(); if(!ac) return;
    try{
      this.mode=mode; this.step=0; this.nextTime=ac.currentTime+0.05;
      this.gain=ac.createGain(); this.gain.gain.value=0.1; this.gain.connect(ac.destination);
      this.schedule(); this.timer=setInterval(()=>this.schedule(),50);
    }catch(e){ this.stop(); }
  },
  note(freq,when,dur,type,vol){
    const ac=SFX.ctx; if(!ac||!this.gain||!freq) return;
    const o=ac.createOscillator(), g=ac.createGain(); o.type=type; o.frequency.value=freq;
    g.gain.setValueAtTime(vol,when); g.gain.exponentialRampToValueAtTime(0.0001,when+dur*0.82);
    o.connect(g); g.connect(this.gain); o.start(when); o.stop(when+dur);
  },
  schedule(){
    const ac=SFX.ctx; if(!ac||!this.mode) return;
    const tempo=this.mode==='boss'?172:150, beat=60/tempo/2, melody=this.melodies[this.mode];
    while(this.nextTime<ac.currentTime+0.16){
      const n=melody[this.step%melody.length];
      this.note(n,this.nextTime,beat*0.9,'square',0.19);
      if(this.step%2===0) this.note(n/2,this.nextTime,beat*1.8,'triangle',0.24);
      this.step++; this.nextTime+=beat;
    }
  },
  stop(){
    if(this.timer) clearInterval(this.timer); this.timer=null; this.mode=null;
    if(this.gain){ try{ this.gain.disconnect(); }catch(e){} this.gain=null; }
  }
};

const HiScore = {
  value:0,
  load(){ try{ const v=Number(localStorage.getItem('weilong_hi')); this.value=Number.isFinite(v)&&v>0?Math.floor(v):0; }catch(e){ this.value=0; } },
  update(score){
    if(score<=this.value) return this.value;
    this.value=Math.floor(score);
    try{ localStorage.setItem('weilong_hi',String(this.value)); }catch(e){}
    return this.value;
  }
};
HiScore.load();

/* =========================================================================
   输入
   ========================================================================= */
const keys = {};
const KEYMAP = {
  'a':'left','arrowleft':'left','d':'right','arrowright':'right',
  'w':'up','arrowup':'up','s':'down','arrowdown':'down',
  ' ':'jump','j':'shoot','k':'shoot','enter':'start','p':'pause','r':'restart'
};
addEventListener('keydown', e=>{
  SFX.init();
  const k = KEYMAP[e.key.toLowerCase()];
  if (k){ keys[k]=true; if(['jump','up','down','left','right','shoot'].includes(k)) e.preventDefault(); }
});
addEventListener('keyup', e=>{ const k=KEYMAP[e.key.toLowerCase()]; if(k) keys[k]=false; });
addEventListener('pointerdown', ()=>SFX.init(), {passive:true});

/* 触屏控制（手机浏览器） */
const touch = document.getElementById('touch');
let tapStart = false;
const isTouchDevice = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
if (isTouchDevice){
  touch.classList.add('show');
  document.getElementById('hint').style.display = 'none';
}

/* 强制横屏 + 全屏沉浸（必须在用户手势中调用） */
function enterImmersive(){
  if (!isTouchDevice) return;
  const el = document.documentElement;
  const fn = el.requestFullscreen || el.webkitRequestFullscreen;
  if (fn){ try{ const r = fn.call(el); if (r && r.catch) r.catch(()=>{}); }catch(e){} }
  if (screen.orientation && screen.orientation.lock){
    screen.orientation.lock('landscape').catch(()=>{});
  }
}
function isPortrait(){
  if (screen.orientation && screen.orientation.type) return screen.orientation.type.indexOf('portrait') === 0;
  return window.innerHeight > window.innerWidth;
}
function refreshOrient(){
  if (!G) return;
  // 游戏进行中误转为竖屏时暂停，转回横屏自动继续
  if (isTouchDevice && G.state==='play' && isPortrait()){
    G.orientPause = true; BGM.stop();
  } else if (G.orientPause && !isPortrait()){
    G.orientPause = false; BGM.start(G.bossActive?'boss':'level');
  }
}
window.addEventListener('orientationchange', refreshOrient);
window.addEventListener('resize', refreshOrient);
const rotGo = document.getElementById('rotGo');
if (rotGo) rotGo.addEventListener('click', enterImmersive);

document.querySelectorAll('#touch button').forEach(b=>{
  const k = b.dataset.k;
  const on  = e=>{ e.preventDefault(); enterImmersive(); keys[k]=true; if (G && G.state!=='play') tapStart=true; };
  const off = e=>{ e.preventDefault(); keys[k]=false; };
  b.addEventListener('pointerdown', on);
  b.addEventListener('pointerup', off);
  b.addEventListener('pointercancel', off);
  b.addEventListener('pointerleave', off);
  b.addEventListener('contextmenu', e=>e.preventDefault());
});
cv.addEventListener('pointerdown', e=>{
  enterImmersive();
  if (G && (G.state==='title'||G.state==='win'||G.state==='lose')) tapStart=true;
});

/* =========================================================================
   游戏世界
   ========================================================================= */
const GROUND_Y = VH - 56;
const LEVEL_W = 3400;
const GRAV = 0.75, MOVE = 3.4, JUMP = -13.2;

let G = null;
function newGame(){
  return {
    state:'title', // title | play | pause | win | lose
    t:0, cam:0,
    player:{
      x:120, y:GROUND_Y-48, vx:0, vy:0, w:26, h:46,
      onGround:true, facing:1, aim:{x:1,y:0}, shootCd:0, shootAnim:0,
      inv:0, starInv:0, weapon:'rifle', anim:'idle', animT:0, crouch:false, dead:0
    },
    enemies:[], pbullets:[], ebullets:[], parts:[], powerups:[],
    boss:null, bossActive:false, bossTriggerX: LEVEL_W-620,
    bossLaser:null, warningT:0, winPending:false, slowMo:0,
    score:0, scorePulse:0, lives:3, shake:0, spawnIdx:0, nextEnemyId:1, orientPause:false,
    spawnPoints:[
      {x:700},{x:1050},{x:1300},{x:1500,t:1},{x:1750},{x:2000},{x:2250,t:1},{x:2500},{x:2750},{x:2950}
    ]
  };
}

function spawnEnemy(x, type){
  G.enemies.push({
    id:G.nextEnemyId++,
    x, y:GROUND_Y-44, vx:0, vy:0, w:26, h:44, onGround:true,
    hp: type?3:2, type: type||0, shootCd: 40+Math.random()*40,
    anim:'idle', animT:0, inv:0, dead:false
  });
}

function startBoss(){
  G.bossActive = true;
  G.warningT = 120;
  G.boss = {
    x: LEVEL_W-300, y: GROUND_Y-120, w:84, h:118,
    vx:0, vy:0, onGround:true, hp:150, maxhp:150,
    atkCd:210, phase:0, anim:'idle', animT:0, inv:0, hitFlash:0,
    chargeT:0, dir:-1, dead:false
  };
  BGM.start('boss');
}

const WEAPONS = {
  rifle:{ name:'步枪', cd:0.13, speed:10, r:4, damage:1, color:'#ffe27a' },
  shotgun:{ name:'散弹枪 S', cd:0.25, speed:9, r:4, damage:1, color:'#ff9b45' },
  machine:{ name:'机枪 M', cd:0.052, speed:11, r:3, damage:1, color:'#55e7ee' },
  laser:{ name:'激光 L', cd:0.34, speed:13, r:5, damage:2, color:'#ff4fc8', pierce:true }
};

function addScore(points){
  G.score+=points; G.scorePulse=0.22;
}

function fireWeapon(p){
  const weapon=WEAPONS[p.weapon]||WEAPONS.rifle;
  p.shootCd=weapon.cd; p.shootAnim=0.12;
  const mx=p.x+p.w/2+p.aim.x*22, my=p.y+p.h/2+p.aim.y*14;
  const base=Math.atan2(p.aim.y,p.aim.x);
  const angles=p.weapon==='shotgun'?[-0.25,-0.08,0.08,0.25]:[0];
  for(const offset of angles){
    const a=base+offset;
    G.pbullets.push({
      x:mx,y:my,vx:Math.cos(a)*weapon.speed,vy:Math.sin(a)*weapon.speed,
      r:weapon.r,life:90,damage:weapon.damage,color:weapon.color,
      pierce:!!weapon.pierce,hitIds:[],hitBoss:false
    });
  }
  G.parts.push({x:mx+p.aim.x*10,y:my+p.aim.y*8,vx:0,vy:0,life:6,maxLife:6,c:weapon.color,r:5,kind:'spark'});
  SFX.shoot();
}

function spawnPowerup(x,y,type,value){
  G.powerups.push({x,y,baseX:x,baseY:Math.min(y,GROUND_Y-30),w:24,h:24,type,value:value||null,age:Math.random()*6,life:900});
}

function dropEnemyLoot(e){
  if(Math.random()<0.12){
    const choices=['shotgun','machine','laser'];
    const weapon=choices[Math.floor(Math.random()*choices.length)];
    spawnPowerup(e.x+e.w/2-12,e.y+8,'weapon',weapon);
  }
  if(Math.random()<0.30) spawnPowerup(e.x+e.w/2-12,e.y+12,'health');
  if(Math.random()<0.04) spawnPowerup(e.x+e.w/2-12,e.y+4,'star');
}

function collectPowerup(item){
  const p=G.player;
  if(item.type==='weapon') p.weapon=item.value;
  else if(item.type==='health') G.lives=Math.min(5,G.lives+1);
  else if(item.type==='star') p.starInv=8;
  item.life=0; addScore(50); SFX.pickup();
}

function finishGame(state){
  if(G.state===state) return;
  G.state=state; HiScore.update(G.score); BGM.stop();
  if(state==='win') SFX.win(); else SFX.lose();
}

function beginBossDefeat(){
  if(G.winPending) return;
  G.winPending=true; G.slowMo=30; G.boss.dead=true; G.boss.hp=0;
  const x=G.boss.x+G.boss.w/2, y=G.boss.y+G.boss.h/2;
  for(let i=0;i<42;i++){
    const a=Math.random()*Math.PI*2, sp=2+Math.random()*8;
    G.parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-2,life:35+Math.random()*35,maxLife:70,
      c:i%3===0?'#fff3a0':i%2?'#ff5b4b':'#ff9b32',r:4+Math.random()*9,kind:'debris'});
  }
  G.shake=26; SFX.enemyExplosion();
}

/* =========================================================================
   更新
   ========================================================================= */
function update(){
  if (G.state !== 'play') return;
  if (G.orientPause) return;
  G.t++;
  const p = G.player;
  if(G.warningT>0) G.warningT--;
  if(G.scorePulse>0) G.scorePulse=Math.max(0,G.scorePulse-1/60);
  if(G.winPending){ updateParticles(); return; }

  /* 玩家移动 */
  let move=0;
  if (keys.left) move=-1; if (keys.right) move=1;
  p.vx = move*MOVE;
  if (move!==0) p.facing = move;
  p.crouch = keys.down && p.onGround;

  // 瞄准方向（魂斗罗式八方向）
  let ax=0, ay=0;
  if (keys.up) ay=-1;
  if (keys.down && !p.onGround) ay=1;
  if (move!==0) ax=move;
  else if (ay!==0) ax=0; else ax=p.facing;
  // 斜向归一化
  if (ax!==0 && ay!==0){ const inv=1/Math.SQRT2; ax*=inv; ay*=inv; }
  if (!(ax===0&&ay===0)) p.aim={x:ax,y:ay};

  // 跳跃
  if (keys.jump && p.onGround){ p.vy=JUMP; p.onGround=false; SFX.jump(); }

  p.vy += GRAV;
  p.x += p.vx; p.y += p.vy;
  if (p.y >= GROUND_Y - p.h){ p.y = GROUND_Y-p.h; p.vy=0; p.onGround=true; }
  p.x = Math.max(20, Math.min(LEVEL_W-p.w-20, p.x));

  // 动画选择
  if (!p.onGround) p.anim='jump';
  else if (p.shootAnim>0) p.anim='shoot';
  else if (move!==0) p.anim='run';
  else p.anim='idle';
  p.animT += 1/60; p.shootAnim = Math.max(0, p.shootAnim-1/60);
  if (p.inv>0) p.inv-=1/60;
  if (p.starInv>0) p.starInv=Math.max(0,p.starInv-1/60);

  // 射击
  p.shootCd -= 1/60;
  if (keys.shoot && p.shootCd<=0){
    fireWeapon(p);
  }

  /* 敌人生成（到达触发点） */
  while (G.spawnIdx < G.spawnPoints.length && p.x > G.spawnPoints[G.spawnIdx].x-360){
    const sp = G.spawnPoints[G.spawnIdx];
    spawnEnemy(sp.x, sp.t);
    G.spawnIdx++;
  }

  /* Boss 触发 */
  if (!G.bossActive && p.x > G.bossTriggerX){ startBoss(); }

  /* 相机 */
  const targetCam = Math.max(0, Math.min(p.x - VW*0.38, LEVEL_W - VW));
  G.cam += (targetCam - G.cam) * 0.12;

  // ---- 敌人更新 ----
  for (const e of G.enemies){
    if (e.dead) continue;
    const dx = (p.x+p.w/2) - (e.x+e.w/2);
    const adist = Math.abs(dx);
    if (adist > 40 && adist < 460){
      e.vx = Math.sign(dx)*1.6;
      e.facing = Math.sign(dx);
    } else e.vx = 0;
    e.vy += GRAV; e.x += e.vx; e.y += e.vy;
    if (e.y >= GROUND_Y-e.h){ e.y=GROUND_Y-e.h; e.vy=0; e.onGround=true; }
    e.x = Math.max(0, Math.min(LEVEL_W-e.w, e.x));
    e.anim = e.vx!==0 ? 'run' : 'idle'; e.animT += 1/60;
    if (e.inv>0) e.inv-=1/60;
    e.shootCd--;
    if (e.shootCd<=0 && adist<460 && Math.abs((p.y)-(e.y))<160){
      e.shootCd = 70+Math.random()*50;
      const ang = Math.atan2((p.y+p.h/2)-(e.y+e.h/2), dx);
      const sp=5.2;
      G.ebullets.push({ x:e.x+e.w/2, y:e.y+e.h/2, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp, r:5, life:160 });
    }
  }
  G.enemies = G.enemies.filter(e=>!e.dead);

  // ---- Boss 更新 ----
  if (G.bossActive && G.boss){
    const b = G.boss;
    b.animT += 1/60;
    if (b.hitFlash>0) b.hitFlash-=1/60;
    const pdx = (p.x+p.w/2)-(b.x+b.w/2);
    b.dir = Math.sign(pdx)||-1;
    if(G.bossLaser){
      const laser=G.bossLaser;
      b.vx=0; b.anim='atk2'; laser.timer--;
      if(laser.phase==='warn' && laser.timer<=0){ laser.phase='active'; laser.timer=42; }
      else if(laser.phase==='active'){
        if(p.y+p.h>laser.y && p.y<laser.y+laser.h) damagePlayer();
        if(laser.timer<=0){ G.bossLaser=null; b.anim='idle'; }
      }
    } else if (b.chargeT>0){
      b.chargeT--; b.vx = b.dir*6.5; b.x += b.vx;
      b.anim = b.chargeT>20?'atk2':'idle';
    } else {
      // 缓慢靠近
      b.vx = Math.abs(pdx)>220 ? b.dir*1.1 : 0;
      b.x += b.vx;
      b.anim = 'idle';
    }
    b.x = Math.max(G.cam+40, Math.min(LEVEL_W-b.w-20, b.x));
    b.atkCd--;
    if (b.atkCd<=0 && b.chargeT<=0 && !G.bossLaser){
      const roll = Math.random();
      if (roll<0.36){ // 扇形弹幕
        b.atkCd = 80; b.anim='atk1';
        const base = Math.atan2((p.y)-(b.y+b.h/2), pdx);
        for (let i=-2;i<=2;i++){
          const a = base + i*0.22;
          G.ebullets.push({ x:b.x+b.w/2, y:b.y+b.h/2, vx:Math.cos(a)*5.5, vy:Math.sin(a)*5.5, r:6, life:200 });
        }
      } else if (roll<0.60){ // 召唤
        b.atkCd = 110;
        spawnEnemy(b.x-60, 1); spawnEnemy(b.x+b.w+20, 1);
      } else if(roll<0.80){ // 冲撞
        b.atkCd = 150; b.chargeT = 36; b.anim='atk2';
      } else { // 第四招：蓄力一秒后横向地面激光
        b.atkCd=170; b.anim='atk2';
        G.bossLaser={phase:'warn',timer:60,y:GROUND_Y-28,h:16};
      }
    }
  }

  // ---- 浮空道具更新与拾取 ----
  for(const item of G.powerups){
    item.age+=1/60; item.life--;
    item.x=item.baseX+Math.sin(item.age*2.4)*8;
    item.y=item.baseY+Math.sin(item.age*4.2)*6;
    if(item.life>0 && aabb(item,p)) collectPowerup(item);
  }
  G.powerups=G.powerups.filter(item=>item.life>0);

  // ---- 子弹更新 ----
  for (const bl of G.pbullets){
    bl.x+=bl.vx; bl.y+=bl.vy; bl.life--;
    if (bl.x<G.cam-40||bl.x>G.cam+VW+40||bl.y<0||bl.y>VH) bl.life=0;
  }
  for (const bl of G.ebullets){
    bl.x+=bl.vx; bl.y+=bl.vy; bl.life--;
    if (bl.x<G.cam-60||bl.x>G.cam+VW+60||bl.y<-20||bl.y>VH+20) bl.life=0;
  }

  // ---- 碰撞：玩家子弹 vs 敌人/Boss ----
  for (const bl of G.pbullets){
    if (bl.life<=0) continue;
    for (const e of G.enemies){
      if (e.dead) continue;
      if (bl.hitIds&&bl.hitIds.includes(e.id)) continue;
      if (hit(bl, e)){
        e.hp-=bl.damage||1; if(bl.hitIds) bl.hitIds.push(e.id); if(!bl.pierce) bl.life=0;
        G.parts.push(expl(bl.x,bl.y,bl.color||'#ffd76b'));
        if (e.hp<=0){
          e.dead=true; addScore(120); dropEnemyLoot(e); SFX.enemyExplosion();
          G.parts.push(expl(e.x+e.w/2,e.y+e.h/2,'#ff8a3b'));
        }
        break;
      }
    }
    if (bl.life<=0) continue;
    if (G.bossActive && G.boss){
      const b=G.boss;
      if (!b.dead && !bl.hitBoss && b.hitFlash<=0 && hit(bl,b)){
        b.hp-=bl.damage||1; b.hitFlash=0.08; bl.hitBoss=true; if(!bl.pierce) bl.life=0; addScore(10); SFX.bossHit();
        G.parts.push(expl(bl.x,bl.y,bl.color||'#ffd76b'));
        if (b.hp<=0){ addScore(2000); beginBossDefeat(); }
      }
    }
  }
  G.pbullets = G.pbullets.filter(b=>b.life>0);
  if(G.winPending){ updateParticles(); return; }

  // ---- 碰撞：敌人子弹 vs 玩家 ----
  for (const bl of G.ebullets){
    if (bl.life<=0) continue;
    if (hit(bl, p)){ bl.life=0; damagePlayer(); }
  }
  G.ebullets = G.ebullets.filter(b=>b.life>0);

  // ---- 接触伤害 ----
  if (p.inv<=0){
    for (const e of G.enemies){ if (!e.dead && aabb(e,p)){ damagePlayer(); break; } }
    if (p.inv<=0 && G.bossActive && G.boss && !G.boss.dead && aabb(G.boss,p)) damagePlayer();
  }

  updateParticles();
}

function updateParticles(){
  for (const pt of G.parts){
    pt.x+=pt.vx; pt.y+=pt.vy; if(pt.kind!=='spark') pt.vy+=0.18; pt.life--;
  }
  G.parts = G.parts.filter(p=>p.life>0);
  if (G.shake>0) G.shake--;
}

function hit(b, e){ // 圆形子弹 vs 矩形
  const cx=Math.max(e.x, Math.min(b.x, e.x+e.w));
  const cy=Math.max(e.y, Math.min(b.y, e.y+e.h));
  return (b.x-cx)**2 + (b.y-cy)**2 <= b.r*b.r;
}
function aabb(a,b){ return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y; }
function expl(x,y,c){ return { x, y, vx:(Math.random()-.5)*3, vy:(Math.random()-.5)*3, life:18, maxLife:18, c, r:6, kind:'spark' }; }
function damagePlayer(){
  const p=G.player;
  if (p.inv>0||p.starInv>0) return;
  G.lives--; p.inv=1.6; p.weapon='rifle'; G.shake=14; SFX.playerHurt();
  G.parts.push(expl(p.x+p.w/2, p.y+p.h/2, '#ff5b4b'));
  if (G.lives<=0) finishGame('lose');
}

/* =========================================================================
   渲染
   ========================================================================= */
function drawBG(){
  // 天空
  const grd = ctx.createLinearGradient(0,0,0,VH);
  grd.addColorStop(0,'#1a2740'); grd.addColorStop(0.6,'#2a3a52'); grd.addColorStop(1,'#16202e');
  ctx.fillStyle=grd; ctx.fillRect(0,0,VW,VH);
  // 远景山（视差 0.25）
  ctx.fillStyle='#223047';
  const off1 = -(G.cam*0.25)%400;
  for (let i=-1;i<4;i++){ const bx=off1+i*400; ctx.beginPath();
    ctx.moveTo(bx, GROUND_Y); ctx.lineTo(bx+200, GROUND_Y-150); ctx.lineTo(bx+400, GROUND_Y); ctx.fill(); }
  // 中景树丛（视差 0.5）
  ctx.fillStyle='#1c2a1e';
  const off2 = -(G.cam*0.5)%260;
  for (let i=-1;i<5;i++){ const bx=off2+i*260;
    ctx.fillRect(bx, GROUND_Y-70, 16, 70); ctx.beginPath();
    ctx.arc(bx+8, GROUND_Y-70, 34, 0, Math.PI*2); ctx.fill(); }
  // 地面
  ctx.fillStyle='#2c2417'; ctx.fillRect(0, GROUND_Y, VW, VH-GROUND_Y);
  ctx.fillStyle='#3a3120'; ctx.fillRect(0, GROUND_Y, VW, 6);
  // 地面纹理条（随相机滚动）
  ctx.fillStyle='#241d12';
  const off3 = -(G.cam)%64;
  for (let i=-1;i<VW/64+1;i++) ctx.fillRect(off3+i*64, GROUND_Y+18, 30, 4);
}

function drawSprite(sheet, anim, frame, sx, sy, w, h, facing){
  const r = frameRect(sheet, anim, frame); if(!r) return;
  ctx.save();
  if (facing<0){ ctx.translate(sx+w, sy); ctx.scale(-1,1); ctx.drawImage(sheet.src, r.sx,r.sy,r.sw,r.sh, 0, 0, w, h); }
  else ctx.drawImage(sheet.src, r.sx,r.sy,r.sw,r.sh, sx, sy, w, h);
  ctx.restore();
}

function animFrame(sheet, anim, t, fps){
  const a = sheet.anims[anim]; if(!a) return 0;
  return Math.floor(t*fps) % a.frames;
}

function render(){
  ctx.save();
  if (G.shake>0){ ctx.translate((Math.random()-.5)*G.shake, (Math.random()-.5)*G.shake); }
  drawBG();

  const p = G.player;
  // 敌人
  for (const e of G.enemies){
    const sx = e.x - G.cam;
    if (sx<-60||sx>VW+60) continue;
    const fr = animFrame(sheets.weilong, e.anim, e.animT, 10);
    if (e.inv>0 && Math.floor(G.t/4)%2===0) ctx.globalAlpha=0.5;
    // 小兵用威龙同款但做红色色调区分敌我
    drawSprite(sheets.weilong, e.anim, fr, sx-35, e.y-52, 96, 96, e.facing||1);
    ctx.globalAlpha=1;
    ctx.globalCompositeOperation='source-atop';
    ctx.fillStyle='rgba(255,60,60,0.28)';
    ctx.fillRect(sx-35, e.y-52, 96, 96);
    ctx.globalCompositeOperation='source-over';
    // 血条
    if (e.hp<2){ ctx.fillStyle='#000'; ctx.fillRect(sx+e.w/2-14, e.y-8, 28, 4);
      ctx.fillStyle='#ff5b4b'; ctx.fillRect(sx+e.w/2-14, e.y-8, 28*(e.hp/2), 4); }
  }

  // Boss
  if (G.bossActive && G.boss){
    const b=G.boss; const sx=b.x-G.cam;
    const fr = animFrame(sheets.warden, b.anim, b.animT, 6);
    if (b.hitFlash>0){ ctx.globalAlpha=0.6; }
    const lean=G.bossLaser&&G.bossLaser.phase==='warn'?b.dir*9:0;
    drawSprite(sheets.warden, b.anim, fr, sx-46+lean, b.y-58, 176, 176, b.dir);
    ctx.globalAlpha=1;
  }

  // Boss 地面激光：先画预警线，蓄力完成后全屏横扫
  if(G.bossLaser){
    const laser=G.bossLaser, sy=laser.y;
    if(laser.phase==='warn'){
      ctx.globalAlpha=0.35+Math.sin(G.t*0.7)*0.2;
      ctx.fillStyle='#ff3048'; ctx.fillRect(0,sy, VW,3);
    }else{
      ctx.globalAlpha=0.75; ctx.fillStyle='#ff174c'; ctx.fillRect(0,sy,VW,laser.h);
      ctx.globalAlpha=0.95; ctx.fillStyle='#fff2f5'; ctx.fillRect(0,sy+5,VW,5);
      ctx.globalAlpha=0.7; ctx.fillStyle='#ff6688';
      const sweep=(G.t*28)%(VW+220)-220; ctx.fillRect(sweep,sy-5,220,laser.h+10);
    }
    ctx.globalAlpha=1;
  }

  // 程序化像素道具
  for(const item of G.powerups){
    const sx=item.x-G.cam, sy=item.y;
    if(sx<-30||sx>VW+30) continue;
    const color=item.type==='weapon'?(WEAPONS[item.value]||WEAPONS.rifle).color:item.type==='health'?'#62e47a':'#ffe85a';
    ctx.fillStyle='rgba(0,0,0,.45)'; ctx.fillRect(sx+2,sy+3,24,24);
    ctx.fillStyle='#17202b'; ctx.fillRect(sx,sy,24,24);
    ctx.fillStyle=color; ctx.fillRect(sx+2,sy+2,20,20);
    ctx.fillStyle='#111820'; ctx.fillRect(sx+5,sy+5,14,14);
    ctx.fillStyle=color; ctx.font='bold 14px monospace'; ctx.textAlign='center';
    const label=item.type==='weapon'?item.value[0].toUpperCase():item.type==='health'?'+':'★';
    ctx.fillText(label,sx+12,sy+17); ctx.textAlign='left';
  }

  // 玩家
  if (G.state==='play' || G.state==='pause'){
    const sx = p.x - G.cam;
    if (!(p.inv>0 && Math.floor(G.t/4)%2===0)){
      const fr = animFrame(sheets.weilong, p.anim, p.animT, p.anim==='run'?14:8);
      if(p.starInv>0){
        ctx.save(); ctx.globalAlpha=0.3+Math.sin(G.t*0.25)*0.12; ctx.fillStyle='#fff36b';
        ctx.beginPath(); ctx.arc(sx+p.w/2,p.y+p.h/2,42,0,Math.PI*2); ctx.fill(); ctx.restore();
      }
      drawSprite(sheets.weilong, p.anim, fr, sx-35, p.y-50, 96, 96, p.facing);
    }
  }

  // 子弹
  for (const bl of G.pbullets){
    ctx.fillStyle=bl.color||'#ffe27a';
    if(bl.pierce) ctx.fillRect(bl.x-G.cam-bl.r*2,bl.y-bl.r/2,bl.r*4,bl.r);
    else { ctx.beginPath(); ctx.arc(bl.x-G.cam, bl.y, bl.r, 0, Math.PI*2); ctx.fill(); }
  }
  ctx.fillStyle='#ff5b4b';
  for (const bl of G.ebullets){ ctx.beginPath(); ctx.arc(bl.x-G.cam, bl.y, bl.r, 0, Math.PI*2); ctx.fill(); }

  // 粒子
  for (const pt of G.parts){ ctx.globalAlpha=Math.max(0,Math.min(1,pt.life/(pt.maxLife||18))); ctx.fillStyle=pt.c;
    ctx.fillRect(pt.x-G.cam-pt.r/2, pt.y-pt.r/2, pt.r, pt.r); }
  ctx.globalAlpha=1;
  ctx.restore();

  drawHUD();
  drawScreens();
}

function drawHUD(){
  // 生命
  ctx.fillStyle='#fff'; ctx.font='bold 16px system-ui'; ctx.textAlign='left';
  ctx.fillText('生命', 16, 26);
  for (let i=0;i<G.lives;i++){ ctx.fillStyle='#ff5b4b'; ctx.fillRect(60+i*22, 14, 16, 14); }
  ctx.fillStyle='#fff';
  ctx.save();
  if(G.scorePulse>0){ const s=1+G.scorePulse*1.5; ctx.translate(16,50); ctx.scale(s,s); ctx.fillText('得分 '+G.score,0,0); }
  else ctx.fillText('得分 '+G.score,16,50);
  ctx.restore();
  ctx.fillStyle=(WEAPONS[G.player.weapon]||WEAPONS.rifle).color; ctx.font='bold 13px system-ui';
  ctx.fillText('武器：'+(WEAPONS[G.player.weapon]||WEAPONS.rifle).name,16,70);
  ctx.textAlign='right';
  ctx.fillText('距终点 '+Math.max(0,Math.round((LEVEL_W-G.player.x)/10))+'m', VW-16, 26);
  ctx.textAlign='left';

  // Boss 血条
  if (G.bossActive && G.boss){
    const w=VW*0.5, x=(VW-w)/2, y=VH-30;
    ctx.fillStyle='rgba(0,0,0,.5)'; ctx.fillRect(x-3,y-3,w+6,16);
    ctx.fillStyle='#3a0d0d'; ctx.fillRect(x,y,w,10);
    ctx.fillStyle='#ff3b30'; ctx.fillRect(x,y,w*Math.max(0,G.boss.hp/G.boss.maxhp),10);
    ctx.fillStyle='#fff'; ctx.font='bold 13px system-ui'; ctx.textAlign='center';
    ctx.fillText('典狱长', VW/2, y-8); ctx.textAlign='left';
  }
}

function drawScreens(){
  if (G.orientPause){
    ctx.fillStyle='rgba(8,11,16,.94)'; ctx.fillRect(0,0,VW,VH);
    ctx.textAlign='center';
    ctx.fillStyle='#54d6e6'; ctx.font='bold 36px system-ui';
    ctx.fillText('↻ 请旋转手机至横屏', VW/2, VH/2-12);
    ctx.fillStyle='#cfd8e3'; ctx.font='15px system-ui';
    ctx.fillText('已为你暂停，转回横屏即可继续', VW/2, VH/2+22);
    ctx.textAlign='left';
    return;
  }
  if (G.state==='title'){
    overlay('威龙突袭', [
      '三角洲行动 × 魂斗罗 风格 Demo',
      '最高分 '+HiScore.value,
      '',
      '电脑：A/D 移动 · W/空格 跳 · W·S 组合瞄准 · J 射击',
      '手机：左下方向键移动/瞄准 · 右下 跳/射击',
      '',
      '击败尽头处的「典狱长」即可通关',
      '',
      '按 回车 / 空格 / 点击屏幕 开始'
    ]);
  } else if (G.state==='win'){
    overlay('任务完成！', ['典狱长已被击溃','最终得分 '+G.score,'最高分 '+HiScore.value,'','按 R 重新挑战'], '#caa53a');
  } else if (G.state==='lose'){
    overlay('行动失败', ['再接再厉','最终得分 '+G.score,'最高分 '+HiScore.value,'','按 R 重新开始'], '#ff5b4b');
  } else if (G.state==='pause'){
    overlay('已暂停', ['按 P 继续'], '#54d6e6');
  }
  if(G.state==='play'&&G.warningT>0){
    const pulse=1+Math.sin(G.t*0.35)*0.08;
    ctx.save(); ctx.translate(VW/2,VH/2); ctx.scale(pulse,pulse); ctx.textAlign='center';
    ctx.fillStyle='rgba(20,0,0,.58)'; ctx.fillRect(-250,-52,500,104);
    ctx.fillStyle='#ff2738'; ctx.font='bold 54px system-ui'; ctx.fillText('警告 WARNING',0,18);
    ctx.restore(); ctx.textAlign='left';
  }
}
function overlay(title, lines, color){
  ctx.fillStyle='rgba(8,11,16,.72)'; ctx.fillRect(0,0,VW,VH);
  ctx.textAlign='center';
  ctx.fillStyle=color||'#fff'; ctx.font='bold 40px system-ui';
  ctx.fillText(title, VW/2, VH/2-60);
  ctx.fillStyle='#cfd8e3'; ctx.font='16px system-ui';
  lines.forEach((l,i)=> ctx.fillText(l, VW/2, VH/2-10 + i*26));
  ctx.textAlign='left';
}

/* =========================================================================
   主循环
   ========================================================================= */
function tick(){
  // 状态切换
  if (G.state==='title' && (keys.start||keys.jump||tapStart)){
    G.state='play'; BGM.start('level'); refreshOrient();
  }
  if ((G.state==='win'||G.state==='lose') && (keys.restart||tapStart)){
    BGM.stop(); G = newGame();
  }
  if (G.state==='play' && keys.pause){
    G.state='pause'; keys.pause=false; BGM.stop();
  } else if (G.state==='pause' && keys.pause){
    G.state='play'; keys.pause=false; BGM.start(G.bossActive?'boss':'level');
  }
  tapStart = false;

  if(G.winPending&&G.slowMo>0){
    if(G.slowMo%3===0) update();
    G.slowMo--;
    if(G.slowMo<=0) finishGame('win');
  } else update();
  render();
  requestAnimationFrame(tick);
}

/* 启动 */
(async function init(){
  sheets.weilong = await loadSheet('weilong');
  sheets.warden  = await loadSheet('warden');
  G = newGame();
  tick();
})();
</script>
</body>
</html>
