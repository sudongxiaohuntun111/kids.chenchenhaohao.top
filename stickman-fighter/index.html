<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>火柴人大乱斗 / Stickman Fighter: Arena of Arms</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="weaponSelect">
  <header id="titleLogo" aria-label="火柴人大乱斗 Stickman Fighter: Arena of Arms">
    <span class="title-cn">火柴人大乱斗</span>
    <span class="title-en">Stickman Fighter: Arena of Arms</span>
  </header>
  <p>选择一把趁手兵器，进入彩色竞技场。</p>
  <div id="weaponGrid"></div>
</div>
<div id="gameWrap">
  <canvas id="gameCanvas" width="1000" height="600"></canvas>
  <div id="mobileControls" aria-label="战斗操作">
    <button class="control-btn" id="leftBtn" type="button"></button>
    <button class="control-btn" id="rightBtn" type="button"></button>
    <button class="control-btn" id="attackBtn" type="button">攻击</button>
    <button class="control-btn" id="blockBtn" type="button">防御</button>
    <button class="control-btn" id="dashBtn" type="button">冲刺</button>
  </div>
  <div id="gameHint">键盘：A/D 移动，J 攻击，K 防御，L 冲刺。手机直接按下方按钮。</div>
</div>
<script src="game.js"></script>
</body>
</html>
