<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Stickman Fighter: Arena of Arms v2.1</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html { height: 100%; background: #101820; }
body {
  min-height: 100svh;
  background:
    radial-gradient(circle at 18% 14%, rgba(255, 196, 87, 0.18), transparent 28%),
    radial-gradient(circle at 82% 16%, rgba(83, 196, 255, 0.16), transparent 30%),
    linear-gradient(135deg, #111927 0%, #17251f 48%, #111018 100%);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 10px;
  overflow: hidden;
  padding: max(10px, env(safe-area-inset-top)) 10px max(10px, env(safe-area-inset-bottom));
  font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
  color: #f7fbff;
}
#gameWrap {
  width: min(100%, 1080px);
  display: grid;
  place-items: center;
  gap: 10px;
}
canvas {
  width: min(100%, calc(100svh * 1.666));
  max-height: calc(100svh - 112px);
  aspect-ratio: 5 / 3;
  height: auto;
  border: 2px solid rgba(255,255,255,0.18);
  border-radius: 14px;
  cursor: crosshair;
  box-shadow: 0 24px 60px rgba(0,0,0,0.45), inset 0 0 0 1px rgba(255,255,255,0.08);
  background: #16202c;
  touch-action: none;
}
#weaponSelect {
  position: fixed; inset: 0;
  background:
    radial-gradient(circle at 50% 12%, rgba(245,166,35,0.24), transparent 30%),
    rgba(11, 14, 22, 0.94);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; z-index: 10;
  padding: 28px 16px;
  overflow-y: auto;
}
#weaponSelect h1 {
  color: #ffd166; font-size: clamp(26px, 6vw, 44px); margin-bottom: 10px;
  text-shadow: 0 0 24px rgba(255,209,102,0.55);
  text-align: center;
}
#weaponSelect p { color: #c9d4e4; font-size: 14px; margin-bottom: 20px; text-align: center; }
#weaponGrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(148px, 1fr)); gap: 12px; width: min(940px, 100%); }
.weapon-card {
  background: linear-gradient(145deg, rgba(38,49,68,0.95), rgba(21,27,42,0.96));
  border: 1px solid rgba(255,255,255,0.16);
  border-radius: 12px; padding: 14px 10px; min-height: 120px; text-align: center;
  cursor: pointer; transition: all 0.2s; user-select: none;
  box-shadow: 0 10px 24px rgba(0,0,0,0.22);
}
.weapon-card:hover { border-color: #ffd166; transform: translateY(-4px); box-shadow: 0 14px 28px rgba(245,166,35,0.25); }
.weapon-card .icon { font-size: 32px; margin-bottom: 6px; }
.weapon-card .weapon-preview { display: block; margin: 4px auto 8px; image-rendering: pixelated; }
.weapon-card .name { color: #fff; font-size: 14px; font-weight: bold; margin-bottom: 4px; }
.weapon-card .stats { color: #aebbd0; font-size: 11px; line-height: 1.5; }
.weapon-card .stats span { color: #ffd166; }
#mobileControls {
  width: min(100%, 720px);
  display: grid;
  grid-template-columns: 54px 54px 1fr 1fr 66px;
  gap: 8px;
}
.control-btn {
  min-height: 48px;
  border: 1px solid rgba(255,255,255,0.18);
  border-radius: 12px;
  background: linear-gradient(180deg, rgba(255,255,255,0.16), rgba(255,255,255,0.06));
  color: #fff;
  font-weight: 800;
  font-size: 15px;
  box-shadow: 0 8px 18px rgba(0,0,0,0.22);
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.control-btn:active,
.control-btn.active {
  transform: translateY(2px);
  background: linear-gradient(180deg, rgba(255,209,102,0.34), rgba(255,109,87,0.22));
  border-color: rgba(255,209,102,0.64);
}
#attackBtn { background: linear-gradient(180deg, rgba(255,92,92,0.72), rgba(129,34,48,0.92)); }
#blockBtn { background: linear-gradient(180deg, rgba(86,171,255,0.72), rgba(30,66,128,0.92)); }
#dashBtn { background: linear-gradient(180deg, rgba(110,232,175,0.68), rgba(20,103,83,0.92)); }
#gameHint {
  color: rgba(241,246,255,0.72);
  font-size: 12px;
  text-align: center;
}
@media (hover: hover) and (pointer: fine) {
  #mobileControls { max-width: 620px; opacity: 0.9; }
}
@media (max-width: 620px) {
  body {
    justify-content: start;
    gap: 8px;
    padding-bottom: calc(72px + env(safe-area-inset-bottom));
  }
  canvas {
    width: 100%;
    height: min(calc(100vh - 112px), calc((100vw - 20px) * 0.78), 420px);
    max-height: none;
    border-radius: 10px;
  }
  #mobileControls {
    position: fixed;
    left: 10px;
    right: 10px;
    bottom: max(10px, env(safe-area-inset-bottom));
    z-index: 8;
    width: auto;
    grid-template-columns: 46px 46px 1fr 1fr 58px;
    gap: 6px;
  }
  .control-btn { min-height: 44px; border-radius: 10px; font-size: 13px; }
  #gameHint { display: none; }
}
</style>
</head>
<body>

<div id="weaponSelect">
  <h1>⚔️ 火柴人大乱斗：兵器谱 v2.1 ⚔️</h1>
  <p>请选择你的趁手兵器开始战斗！</p>
  <div id="weaponGrid"></div>
</div>

<div id="gameWrap">
  <canvas id="gameCanvas" width="1000" height="600"></canvas>
  <div id="mobileControls" aria-label="战斗操作">
    <button class="control-btn" id="leftBtn" type="button">‹</button>
    <button class="control-btn" id="rightBtn" type="button">›</button>
    <button class="control-btn" id="attackBtn" type="button">攻击</button>
    <button class="control-btn" id="blockBtn" type="button">防御</button>
    <button class="control-btn" id="dashBtn" type="button">冲刺</button>
  </div>
  <div id="gameHint">键盘：A/D 移动，J 攻击，K 防御，L 冲刺。手机直接按下方按钮。</div>
</div>

<script>
// ===================== CONSTANTS =====================
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// Fighter positions and arena limits
const PLAYER_START_X = 320;
const ENEMY_START_X = 680;
const ARENA_LEFT = 110;
const ARENA_RIGHT = 890;
const GROUND_Y = 460;
const BODY_HEIGHT = 100;
const BASE_REACH = 58;
const MOVE_SPEED = 0.24;
const DASH_SPEED = 0.95;
const DASH_TIME = 170;
const DASH_COST = 22;
// ===================== SPRITE SHEET LOADING =====================
const spriteImages = { characters: null, weapons: null, loaded: false };

function loadSpriteSheets() {
  const charImg = new Image();
  charImg.crossOrigin = 'anonymous';
  charImg.onload = () => { spriteImages.characters = charImg; checkLoaded(); };
  charImg.onerror = () => { spriteImages.charError = true; checkLoaded(); };
  charImg.src = 'images/characters.png';
  const wpnImg = new Image();
  wpnImg.crossOrigin = 'anonymous';
  wpnImg.onload = () => { spriteImages.weapons = wpnImg; checkLoaded(); };
  wpnImg.onerror = () => { spriteImages.wpnError = true; checkLoaded(); };
  wpnImg.src = 'images/weapons.png';
}
function checkLoaded() {
  if (spriteImages.characters || spriteImages.charError) {
    if (spriteImages.weapons || spriteImages.wpnError) { spriteImages.loaded = true; }
  }
}
loadSpriteSheets();
const CHAR_FRAME_W = 120; const CHAR_FRAME_H = 120;
const WPN_FRAME_W = 100; const WPN_FRAME_H = 60;


// ===================== WEAPON DEFINITIONS =====================
// hitChance: probability factor for reaching the opponent at FIGHTER_DIST
// Higher range weapons have higher hitChance at this distance
const WEAPONS = [
  { id: 'longsword',  name: '长剑',   icon: '🗡️', range: 132, damage: 12, cooldown: 560,  stamina: 12, swingArc: 1.4, swingSpeed: 0.075, activeStart: 0.2, activeEnd: 0.7, trailColor: '#ffcc00', desc: '攻守平衡' },
  { id: 'dagger',     name: '短刀',       icon: '🔪', range: 104, damage: 8,  cooldown: 235,  stamina: 7,  swingArc: 0.8, swingSpeed: 0.06,  activeStart: 0.15,activeEnd: 0.5, trailColor: '#00ffcc', desc: '快攻连击' },
  { id: 'spear',      name: '长矛',        icon: '🔱', range: 196, damage: 10, cooldown: 680,  stamina: 13, swingArc: 0.4, swingSpeed: 0.05,  activeStart: 0.25,activeEnd: 0.65,trailColor: '#00ccff', desc: '控距强势' },
  { id: 'battleaxe',  name: '巨斧',   icon: '🪓', range: 124, damage: 21, cooldown: 960,  stamina: 22, swingArc: 1.6, swingSpeed: 0.095, activeStart: 0.2, activeEnd: 0.8, trailColor: '#ff5f3d', desc: '破防重击' },
  { id: 'mace',       name: '狼牙棒',         icon: '🏏', range: 112, damage: 15, cooldown: 780,  stamina: 17, swingArc: 1.1, swingSpeed: 0.085, activeStart: 0.2, activeEnd: 0.7, trailColor: '#d59a35', desc: '格挡也痛' },
  { id: 'nunchaku',   name: '双节棍',     icon: '🥢', range: 102, damage: 7,  cooldown: 190,  stamina: 6,  swingArc: 2.0, swingSpeed: 0.05,  activeStart: 0.1, activeEnd: 0.5, trailColor: '#ff4dff', desc: '压制节奏' },
  { id: 'greatsword', name: '大剑',   icon: '⚔️', range: 164, damage: 29, cooldown: 1220, stamina: 28, swingArc: 2.2, swingSpeed: 0.115, activeStart: 0.2, activeEnd: 0.8, trailColor: '#ff3535', desc: '慢但致命' },
  { id: 'dualdagger', name: '双持短刀', icon: '🗡️🗡️',range: 108, damage: 10, cooldown: 285,  stamina: 9,  swingArc: 1.0, swingSpeed: 0.055, activeStart: 0.15,activeEnd: 0.5, trailColor: '#00ff88', desc: '左右开弓' },
  { id: 'glaive',     name: '长柄刀',       icon: '⚜️', range: 176, damage: 16, cooldown: 760,  stamina: 16, swingArc: 1.4, swingSpeed: 0.085, activeStart: 0.2, activeEnd: 0.7, trailColor: '#ff9b2e', desc: '横扫反打' },
  { id: 'gauntlet',   name: '拳套',     icon: '🥊', range: 94,  damage: 9,  cooldown: 210,  stamina: 7,  swingArc: 0.6, swingSpeed: 0.04,  activeStart: 0.1, activeEnd: 0.45,trailColor: '#ffdd00', desc: '完美格挡' }
];

// ===================== WEAPON IMAGE CACHE =====================
const weaponImages = {};
function preloadWeaponImages() {
  return new Promise((resolve) => {
    let loaded = 0;
    const total = WEAPONS.length;
    WEAPONS.forEach(w => {
      const img = new Image();
      img.onload = () => {
        loaded++;
        if (loaded >= total) resolve();
      };
      img.onerror = () => {
        loaded++;
        if (loaded >= total) resolve();
      };
      img.src = 'assets/weapons/' + w.id + '.png';
      weaponImages[w.id] = img;
    });
  });
}

// ===================== GAME STATE =====================
let gameState = 'SELECT'; // SELECT, FIGHT, GAMEOVER
let playerWeapon = null, enemyWeapon = null;
let playerHP = 100, enemyHP = 100;
const playerMaxHP = 100, enemyMaxHP = 100;
let playerX = PLAYER_START_X, enemyX = ENEMY_START_X;
let playerStamina = 100, enemyStamina = 100;
let playerDashTimer = 0, enemyDashTimer = 0;
let playerPerfectBlockTimer = 0, enemyPerfectBlockTimer = 0;
let playerCombo = 0, comboTimer = 0;
let battleMessage = '选好武器后开打';
let battleMessageTimer = 0;

let playerAttack = null;  // { progress: 0-1, hasHit: false }
let enemyAttack = null;
let playerDefending = false, enemyDefending = false;
let lastPlayerAttackTime = 0, lastEnemyAttackTime = 0;

let hitEffects = [];
let screenShake = { x: 0, y: 0, intensity: 0 };
let gameTime = 0;
let gameoverTimer = 0; // 结算冷却计时器
let aiDecisionTimer = 0;
let aiDefendTimer = 0;

let lastTime = 0;

// ===================== WEAPON SELECTION UI =====================
function buildWeaponUI() {
  const grid = document.getElementById('weaponGrid');
  WEAPONS.forEach(w => {
    const card = document.createElement('div');
    card.className = 'weapon-card';
    card.innerHTML = `
      <div class="icon">${w.icon}</div>
      <div class="name">${w.name}</div>
      <div class="stats">
        伤害 <span>${w.damage}</span> · 范围 <span>${w.range}</span><br>
        耗力 <span>${w.stamina}</span> · 攻速 <span>${(1000/w.cooldown).toFixed(1)}次/秒</span><br>
        ${w.desc}
      </div>
    `;
    card.addEventListener('click', () => startGame(w));
    grid.appendChild(card);
  });
  setTimeout(drawWeaponPreviews, 300);
}

function startGame(weapon) {
  playerWeapon = weapon;
  document.getElementById('weaponSelect').style.display = 'none';
  let pool = WEAPONS.filter(w => w.id !== weapon.id);
  enemyWeapon = pool[Math.floor(Math.random() * pool.length)];

  playerHP = playerMaxHP;
  enemyHP = enemyMaxHP;
  playerX = PLAYER_START_X;
  enemyX = ENEMY_START_X;
  playerStamina = 100;
  enemyStamina = 100;
  playerDashTimer = 0;
  enemyDashTimer = 0;
  playerPerfectBlockTimer = 0;
  enemyPerfectBlockTimer = 0;
  playerCombo = 0;
  comboTimer = 0;
  battleMessage = `${weapon.name} 对 ${enemyWeapon.name}`;
  battleMessageTimer = 1800;
  playerAttack = null;
  enemyAttack = null;
  playerDefending = false;
  enemyDefending = false;
  hitEffects = [];
  screenShake = { x: 0, y: 0, intensity: 0 };
  lastPlayerAttackTime = 0;
  lastEnemyAttackTime = 0;
  aiDecisionTimer = 0;
  aiDefendTimer = 0;
  gameState = 'FIGHT';
}

// ===================== INPUT =====================
let mouseDownLeft = false, mouseDownRight = false;
let moveLeft = false, moveRight = false, dashQueued = false;
let keyAttackDown = false;

canvas.addEventListener('mousedown', e => {
  if (gameState !== 'FIGHT') return;
  e.preventDefault();
  if (e.button === 0) mouseDownLeft = true;
  if (e.button === 2) mouseDownRight = true;
});
canvas.addEventListener('mouseup', e => {
  if (e.button === 0) mouseDownLeft = false;
  if (e.button === 2) mouseDownRight = false;
});
canvas.addEventListener('pointerdown', e => {
  if (e.pointerType === 'touch' && gameState === 'GAMEOVER' && gameoverTimer <= 0) showWeaponSelect();
});
canvas.addEventListener('contextmenu', e => e.preventDefault());

canvas.addEventListener('click', () => {
  if (gameState === 'GAMEOVER') {
    if (gameoverTimer > 0) return; // 冷却期内不可点击
    showWeaponSelect();
  }
});

function showWeaponSelect() {
  document.getElementById('weaponSelect').style.display = 'flex';
  gameState = 'SELECT';
  gameoverTimer = 0;
}

function bindHoldButton(id, onDown, onUp) {
  const btn = document.getElementById(id);
  const down = e => {
    e.preventDefault();
    btn.classList.add('active');
    onDown();
  };
  const up = e => {
    e.preventDefault();
    btn.classList.remove('active');
    onUp();
  };
  btn.addEventListener('pointerdown', down);
  btn.addEventListener('pointerup', up);
  btn.addEventListener('pointercancel', up);
  btn.addEventListener('pointerleave', up);
}

bindHoldButton('leftBtn', () => { moveLeft = true; }, () => { moveLeft = false; });
bindHoldButton('rightBtn', () => { moveRight = true; }, () => { moveRight = false; });
bindHoldButton('attackBtn', () => { mouseDownLeft = true; }, () => { mouseDownLeft = false; });
bindHoldButton('blockBtn', () => { mouseDownRight = true; }, () => { mouseDownRight = false; });
bindHoldButton('dashBtn', () => { dashQueued = true; }, () => {});

window.addEventListener('keydown', e => {
  const key = e.key.toLowerCase();
  if (key === 'a' || e.key === 'ArrowLeft') moveLeft = true;
  if (key === 'd' || e.key === 'ArrowRight') moveRight = true;
  if (key === 'j' || e.key === ' ') {
    mouseDownLeft = true;
    keyAttackDown = true;
    e.preventDefault();
  }
  if (key === 'k') mouseDownRight = true;
  if (key === 'l') dashQueued = true;
});

window.addEventListener('keyup', e => {
  const key = e.key.toLowerCase();
  if (key === 'a' || e.key === 'ArrowLeft') moveLeft = false;
  if (key === 'd' || e.key === 'ArrowRight') moveRight = false;
  if (key === 'j' || e.key === ' ') {
    mouseDownLeft = false;
    keyAttackDown = false;
  }
  if (key === 'k') mouseDownRight = false;
});

// ===================== DRAWING: SPRITE HELPERS =====================
const WEAPON_GRID = {
  longsword:{row:0,col:0}, dagger:{row:0,col:1}, spear:{row:0,col:2},
  battleaxe:{row:0,col:3}, mace:{row:0,col:4}, nunchaku:{row:1,col:0},
  greatsword:{row:1,col:1}, dualdagger:{row:1,col:2}, glaive:{row:1,col:3}, gauntlet:{row:1,col:4}
};
function drawWeaponPreviewOnCanvas(canvasEl, weaponId) {
  if (!spriteImages.weapons) return;
  const g = WEAPON_GRID[weaponId]; if (!g) return;
  const c = canvasEl.getContext('2d');
  c.clearRect(0, 0, canvasEl.width, canvasEl.height);
  c.drawImage(spriteImages.weapons, g.col*WPN_FRAME_W, g.row*WPN_FRAME_H, WPN_FRAME_W, WPN_FRAME_H, 0, 0, canvasEl.width, canvasEl.height);
}
function drawWeaponPreviews() {
  document.querySelectorAll('.weapon-preview').forEach(c => { if(c.dataset.weapon) drawWeaponPreviewOnCanvas(c, c.dataset.weapon); });
}
function drawWeaponSprite(handX, handY, weapon, isPlayer) {
  if (!spriteImages.weapons) return false;
  const g = WEAPON_GRID[weapon.id]; if (!g) return false;
  ctx.save(); ctx.translate(handX, handY);
  if (!isPlayer) ctx.scale(-1, 1); ctx.rotate(-0.4);
  const s = 0.7, dw = WPN_FRAME_W*s, dh = WPN_FRAME_H*s;
  ctx.drawImage(spriteImages.weapons, g.col*WPN_FRAME_W, g.row*WPN_FRAME_H, WPN_FRAME_W, WPN_FRAME_H, -dw/2, -dh/2, dw, dh);
  ctx.restore(); return true;
}

// ===================== DRAWING: SCENE =====================
function drawBoxingRing() {
  const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
  bgGrad.addColorStop(0, '#20395a');
  bgGrad.addColorStop(0.42, '#173041');
  bgGrad.addColorStop(1, '#101820');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);

  // Neon arena backdrop
  ctx.save();
  for (let i = 0; i < 9; i++) {
    ctx.strokeStyle = `rgba(255, 209, 102, ${0.08 - i * 0.006})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(W / 2, GROUND_Y + 25, 120 + i * 46, Math.PI, Math.PI * 2);
    ctx.stroke();
  }
  ctx.restore();

  // Audience silhouettes
  ctx.fillStyle = 'rgba(8,14,23,0.78)';
  for (let i = 0; i < 35; i++) {
    let ax = 40 + i * 28 + Math.sin(i * 3.7) * 8;
    let ay = 100 + Math.sin(i * 2.1) * 25;
    let s = 0.35 + Math.sin(i * 1.3) * 0.08;
    drawSilhouette(ax, ay, s);
  }

  // Spotlights
  ctx.save();
  ctx.globalAlpha = 0.1;
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.moveTo(120, 0); ctx.lineTo(220, H); ctx.lineTo(20, H); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(W-120, 0); ctx.lineTo(W-220, H); ctx.lineTo(W-20, H); ctx.closePath(); ctx.fill();
  ctx.restore();

  // Ring floor
  const floorGrad = ctx.createLinearGradient(0, GROUND_Y + 40, 0, H);
  floorGrad.addColorStop(0, '#72502d');
  floorGrad.addColorStop(0.45, '#4b3828');
  floorGrad.addColorStop(1, '#202734');
  ctx.fillStyle = floorGrad;
  ctx.fillRect(40, GROUND_Y + 40, W - 80, H - GROUND_Y - 40);

  // Ring floor lines
  ctx.strokeStyle = 'rgba(255,255,255,0.08)';
  ctx.lineWidth = 1;
  for (let x = 60; x < W - 60; x += 35) {
    ctx.beginPath(); ctx.moveTo(x, GROUND_Y + 40); ctx.lineTo(x, H); ctx.stroke();
  }

  // Ring posts
  const posts = [60, W - 60];
  posts.forEach(px => {
    ctx.fillStyle = '#2c3546';
    ctx.fillRect(px - 5, GROUND_Y - 30, 10, 80);
    ctx.fillStyle = '#ffd166';
    ctx.beginPath(); ctx.arc(px, GROUND_Y - 34, 8, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#333'; ctx.lineWidth = 1; ctx.stroke();
  });

  // Ring ropes
  for (let rope = 0; rope < 3; rope++) {
    let ry = GROUND_Y - 10 + rope * 18;
    ctx.strokeStyle = rope < 2 ? '#cc3333' : '#ffffff';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(60, ry); ctx.lineTo(W - 60, ry); ctx.stroke();
  }

  // Ring edge
  ctx.strokeStyle = '#ffd166';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(60, GROUND_Y + 40); ctx.lineTo(W - 60, GROUND_Y + 40); ctx.stroke();

  ctx.strokeStyle = 'rgba(255,255,255,0.12)';
  ctx.setLineDash([8, 10]);
  ctx.beginPath(); ctx.moveTo(ARENA_LEFT, GROUND_Y + 42); ctx.lineTo(ARENA_RIGHT, GROUND_Y + 42); ctx.stroke();
  ctx.setLineDash([]);
}

function drawSilhouette(x, y, s) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s, s);
  ctx.beginPath(); ctx.arc(0, -22, 11, 0, Math.PI * 2); ctx.fill();
  ctx.fillRect(-6, -11, 12, 28);
  ctx.fillRect(-18, -8, 12, 5);
  ctx.fillRect(6, -8, 12, 5);
  ctx.fillRect(-9, 17, 7, 20);
  ctx.fillRect(2, 17, 7, 20);
  ctx.restore();
}

// ===================== DRAWING: STICKMAN =====================
function drawStickman(cx, gy, colors, isPlayer, weapon, attacking, defending, attackProgress, time) {
  const headY = gy - BODY_HEIGHT;
  const torsoTop = headY + 22;
  const torsoBottom = gy - 30;
  const headR = 18;

  ctx.save();

  // Animation state
  let rightArmAngle = 0, bodyTilt = 0;

  if (attacking && attackProgress != null) {
    let p = attackProgress;
    let w = weapon;
    if (p < 0.2) {
      let t = p / 0.2;
      rightArmAngle = -0.9 * t;
      bodyTilt = -6 * t;
    } else if (p < 0.7) {
      let t = (p - 0.2) / 0.5;
      rightArmAngle = -0.9 + w.swingArc * t;
      bodyTilt = -6 + 12 * t;
    } else {
      let t = (p - 0.7) / 0.3;
      let midAngle = -0.9 + w.swingArc * 0.5;
      rightArmAngle = midAngle * (1 - t);
      bodyTilt = 6 * (1 - t);
    }
  } else {
    bodyTilt = Math.sin(time * 0.003) * 2;
    rightArmAngle = Math.sin(time * 0.004) * 0.1;
  }

  // Shield when defending
  if (defending) {
    let shieldX = isPlayer ? cx + 22 : cx - 22;
    drawShield(shieldX, torsoTop + 18, isPlayer ? '#4488ff' : '#8844aa');
  }

  ctx.save();
  ctx.translate(cx, 0);
  if (!isPlayer) ctx.scale(-1, 1);
  ctx.rotate(bodyTilt * Math.PI / 180);

  // Legs
  ctx.strokeStyle = colors.legs;
  ctx.lineWidth = 5;
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0, torsoBottom); ctx.lineTo(-18, gy); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, torsoBottom); ctx.lineTo(18, gy); ctx.stroke();

  // Torso
  ctx.strokeStyle = colors.torso;
  ctx.lineWidth = 6;
  ctx.beginPath(); ctx.moveTo(0, torsoTop); ctx.lineTo(0, torsoBottom); ctx.stroke();

  // Left arm
  ctx.strokeStyle = colors.leftArm;
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(0, torsoTop + 8);
  ctx.lineTo(-20, torsoTop + 30);
  ctx.lineTo(-14, torsoTop + 42);
  ctx.stroke();

  // Right arm (weapon arm)
  ctx.save();
  ctx.translate(0, torsoTop + 8);
  ctx.rotate(rightArmAngle);

  ctx.strokeStyle = colors.rightArm;
  ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(28, 12); ctx.stroke();

  // Weapon at hand
  if (weapon && !defending) {
    drawWeaponAt(28, 12, weapon, isPlayer, time);
  }
  ctx.restore();

  // Head
  ctx.fillStyle = colors.head;
  ctx.strokeStyle = colors.headStroke || colors.head;
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(0, headY, headR, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

  // Eyes
  ctx.fillStyle = '#fff';
  let ex = isPlayer ? 5 : -5;
  ctx.beginPath(); ctx.arc(ex - 4, headY - 3, 4, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(ex + 6, headY - 3, 4, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = isPlayer ? '#00f' : '#f0f';
  ctx.beginPath(); ctx.arc(ex - 3, headY - 3, 2, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(ex + 7, headY - 3, 2, 0, Math.PI * 2); ctx.fill();

  ctx.restore();
  ctx.restore();
}

function drawWeaponAt(handX, handY, weapon, isPlayer, time) {
  if (drawWeaponSprite(handX, handY, weapon, isPlayer)) return;
  ctx.save();
  ctx.translate(handX, handY);

  const img = weaponImages[weapon.id];
  if (img && img.complete && img.naturalWidth > 0) {
    // Handle vertical offset as fraction of height (per-weapon data from sprite analysis)
    const handleOffsets = {
      longsword: 0.936, dagger: 0.119, spear: 0.972,
      battleaxe: 0.434, mace: 0.560, nunchaku: 0.761,
      greatsword: 0.939, dualdagger: 0.056, glaive: 0.932, gauntlet: 0.769
    };
    const handleFrac = handleOffsets[weapon.id] || 0.5;

    // Scale: original canvas drawing was ~70-110px. Keep a consistent display size.
    const scale = 100 / img.naturalWidth;
    const w = img.naturalWidth * scale;
    const h = img.naturalHeight * scale;

    // Draw so that the handle (at handleFrac * h) aligns with origin (hand position)
    ctx.drawImage(img, 0, -handleFrac * h, w, h);
  }

  ctx.restore();
}

function drawShield(x, y, color) {
  ctx.save();
  ctx.fillStyle = color;
  ctx.globalAlpha = 0.7;
  ctx.beginPath(); ctx.ellipse(x, y, 14, 22, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
  ctx.globalAlpha = 0.4;
  ctx.stroke();
  ctx.restore();
}

// ===================== WEAPON TRAIL =====================
function drawWeaponTrail(cx, gy, weapon, attackProgress, isPlayer) {
  if (attackProgress == null || attackProgress < 0.12 || attackProgress > 0.78) return;

  const torsoTop = gy - BODY_HEIGHT + 22 + 8; // shoulder Y
  let startAngle = -0.9;
  let currentAngle = startAngle + weapon.swingArc * ((attackProgress - 0.12) / 0.66);

  ctx.save();
  ctx.translate(cx, torsoTop);
  if (!isPlayer) ctx.scale(-1, 1);

  // Swing arc
  ctx.strokeStyle = weapon.trailColor;
  ctx.lineWidth = 5;
  ctx.globalAlpha = 0.4;
  ctx.beginPath();
  let arcR = weapon.range * 0.85;
  ctx.arc(0, 0, arcR, startAngle, currentAngle);
  ctx.stroke();

  // Weapon tip dot
  let tipX = Math.cos(currentAngle) * weapon.range * 0.85;
  let tipY = Math.sin(currentAngle) * weapon.range * 0.85 + 12;

  ctx.globalAlpha = 0.9;
  ctx.fillStyle = weapon.trailColor;
  ctx.beginPath(); ctx.arc(tipX, tipY, 7, 0, Math.PI * 2); ctx.fill();

  ctx.globalAlpha = 0.25;
  ctx.beginPath(); ctx.arc(tipX, tipY, 16, 0, Math.PI * 2); ctx.fill();

  ctx.restore();
}

// ===================== CRITICAL: HIT DETECTION =====================
/**
 * 简化的判定逻辑：
 * 1. 距离检查：只要距离 < 武器 range + 基础臂长 (60)，就视为可命中。
 * 2. 活跃帧：进度在 [activeStart, activeEnd] 之间。
 * 3. 阶段标志位：确保一次攻击只命中一次。
 */
function checkHit(attackerX, defenderX, weapon, attackProgress) {
  if (!weapon || attackProgress == null) return false;

  // 条件 1：活跃帧检查
  if (attackProgress < weapon.activeStart || attackProgress > weapon.activeEnd) return false;

  // 条件 2：距离检查 (基础臂长 60 + 武器 range)
  const dist = Math.abs(attackerX - defenderX);
  const maxReach = 60 + weapon.range;
  if (dist >= maxReach) return false;  // 严格判定：等于或大于都miss

  return true;
}

function clamp(value, min, max) {
  return Math.max(min, Math.min(max, value));
}

function setBattleMessage(text, time = 900) {
  battleMessage = text;
  battleMessageTimer = time;
}

function canStartAttack(weapon, lastAttackTime, stamina) {
  return gameTime - lastAttackTime > weapon.cooldown && stamina >= weapon.stamina;
}

function startPlayerAttack() {
  if (playerDefending || playerAttack || !canStartAttack(playerWeapon, lastPlayerAttackTime, playerStamina)) return;
  playerAttack = { progress: 0, hasHit: false };
  playerStamina -= playerWeapon.stamina;
  lastPlayerAttackTime = gameTime;
}

function startEnemyAttack() {
  if (enemyDefending || enemyAttack || !canStartAttack(enemyWeapon, lastEnemyAttackTime, enemyStamina)) return;
  enemyAttack = { progress: 0, hasHit: false };
  enemyStamina -= enemyWeapon.stamina;
  lastEnemyAttackTime = gameTime;
}

function tryDash(isPlayer) {
  if (isPlayer) {
    if (playerDashTimer > 0 || playerStamina < DASH_COST || playerAttack) return;
    playerStamina -= DASH_COST;
    playerDashTimer = DASH_TIME;
    setBattleMessage('冲刺调整距离');
  } else {
    if (enemyDashTimer > 0 || enemyStamina < DASH_COST || enemyAttack) return;
    enemyStamina -= DASH_COST;
    enemyDashTimer = DASH_TIME;
  }
}

function applyDamage(target, weapon, targetDefending, perfectTimer, comboBonus = 1) {
  const baseDamage = Math.round(weapon.damage * comboBonus);
  if (targetDefending) {
    if (perfectTimer > 0) {
      addHitEffect(target === 'enemy' ? enemyX : playerX, GROUND_Y - BODY_HEIGHT / 2, 0, 'perfect');
      addScreenShake(5);
      return { damage: 0, blocked: true, perfect: true };
    }
    const guardFactor = weapon.id === 'mace' || weapon.id === 'battleaxe' ? 0.34 : 0.18;
    const reducedDmg = Math.max(1, Math.ceil(baseDamage * guardFactor));
    if (target === 'enemy') enemyHP -= reducedDmg; else playerHP -= reducedDmg;
    addHitEffect(target === 'enemy' ? enemyX : playerX, GROUND_Y - BODY_HEIGHT / 2, reducedDmg, 'blocked');
    addScreenShake(4);
    return { damage: reducedDmg, blocked: true, perfect: false };
  }

  if (target === 'enemy') enemyHP -= baseDamage; else playerHP -= baseDamage;
  addHitEffect(target === 'enemy' ? enemyX : playerX, GROUND_Y - BODY_HEIGHT / 2, baseDamage, 'hit');
  addScreenShake(8 + Math.min(10, baseDamage * 0.35));
  return { damage: baseDamage, blocked: false, perfect: false };
}

// ===================== HIT EFFECTS =====================
function addHitEffect(x, y, damage, type) {
  hitEffects.push({ x, y, damage, time: 0, maxTime: 500, type });
}

function addScreenShake(intensity) {
  screenShake.intensity = Math.max(screenShake.intensity, intensity);
}

function updateHitEffects(dt) {
  hitEffects = hitEffects.filter(e => e.time < e.maxTime);
  for (let e of hitEffects) {
    e.time += dt;
  }
}

function drawHitEffects() {
  for (let e of hitEffects) {
    let t = e.time / e.maxTime;
    if (t >= 1) continue;

    ctx.save();
    ctx.translate(e.x, e.y);

    if (e.type === 'hit') {
      // Starburst sparks
      let rays = 8;
      let len = 28 * (1 - t);
      ctx.strokeStyle = `rgba(255, 255, 100, ${1 - t})`;
      ctx.lineWidth = 3;
      for (let i = 0; i < rays; i++) {
        let a = (i / rays) * Math.PI * 2 + t * 0.5;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(Math.cos(a) * len, Math.sin(a) * len);
        ctx.stroke();
      }
      // Center flash
      ctx.fillStyle = `rgba(255, 255, 200, ${1 - t})`;
      ctx.beginPath(); ctx.arc(0, 0, 12 * (1 - t), 0, Math.PI * 2); ctx.fill();
      // Damage number
      ctx.fillStyle = `rgba(255, 50, 50, ${1 - t})`;
      ctx.font = `bold ${20 + 8 * (1 - t)}px Arial`;
      ctx.textAlign = 'center';
      ctx.fillText(`-${e.damage}`, 0, -22 - 22 * t);
    } else if (e.type === 'blocked' || e.type === 'perfect') {
      const perfect = e.type === 'perfect';
      ctx.strokeStyle = perfect ? `rgba(255, 230, 120, ${1 - t})` : `rgba(100, 180, 255, ${1 - t})`;
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(0, 0, 22 + 12 * t, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = perfect ? `rgba(255, 225, 120, ${(1 - t) * 0.26})` : `rgba(150, 200, 255, ${(1 - t) * 0.3})`;
      ctx.fill();
      if (perfect) {
        ctx.fillStyle = `rgba(255, 245, 190, ${1 - t})`;
        ctx.font = `bold 18px Arial`;
        ctx.textAlign = 'center';
        ctx.fillText('PERFECT!', 0, -32);
      } else if (e.damage > 0) {
        ctx.fillStyle = `rgba(200, 200, 255, ${1 - t})`;
        ctx.font = `bold 16px Arial`;
        ctx.textAlign = 'center';
        ctx.fillText(`-${e.damage}`, 0, -30);
      } else {
        ctx.fillStyle = `rgba(150, 200, 255, ${1 - t})`;
        ctx.font = `bold 16px Arial`;
        ctx.textAlign = 'center';
        ctx.fillText('BLOCKED!', 0, -30);
      }
    }
    ctx.restore();
  }
}

// ===================== HUD =====================
function drawHUD() {

  roundRect(15, 12, 350, 68, 14, true);

  // VS
  ctx.textAlign = 'center';

    ctx.fillText(`${playerCombo} HIT`, W / 2, 98);
  }

  if (battleMessageTimer > 0) {
    ctx.fillStyle = 'rgba(8,12,20,0.58)';

function roundRect(x, y, w, h, r, fill) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  if (fill) ctx.fill(); else ctx.stroke();
}

// ===================== GAME OVER =====================
function drawGameOver() {
  ctx.fillStyle = 'rgba(0,0,0,0.75)';
  ctx.fillRect(0, 0, W, H);

  let won = enemyHP <= 0;
  ctx.textAlign = 'center';

  if (won) {
    ctx.fillStyle = '#f5a623';
    ctx.font = 'bold 56px Arial';
    ctx.fillText('🏆 胜利！ 🏆', W / 2, H / 2 - 40);
    ctx.fillStyle = '#fff';
    ctx.font = '20px Arial';
    ctx.fillText('你成功击败了对手！', W / 2, H / 2 + 5);
  } else {
    ctx.fillStyle = '#ff4444';
    ctx.font = 'bold 56px Arial';
    ctx.fillText('💀 败北 💀', W / 2, H / 2 - 40);
    ctx.fillStyle = '#fff';
    ctx.font = '20px Arial';
    ctx.fillText('你被敌人击败了...', W / 2, H / 2 + 5);
  }

  ctx.fillStyle = '#aaa';
  ctx.font = '16px Arial';
  let cd = Math.ceil(gameoverTimer / 1000);
  if (cd > 0) {
    ctx.fillText(`战斗结束，${cd}秒后可重新开始...`, W / 2, H / 2 + 45);
  } else {
    ctx.fillText('点击任意处重新开始', W / 2, H / 2 + 45);
  }
}

// ===================== AI LOGIC =====================
function updateAI(dt) {
  if (gameState !== 'FIGHT') return;

  aiDecisionTimer += dt;
  const dist = Math.abs(enemyX - playerX);
  const preferred = BASE_REACH + enemyWeapon.range * 0.72;
  let enemyMove = 0;

  if (!enemyAttack && !enemyDefending && enemyDashTimer <= 0) {
    if (dist > preferred + 24) enemyMove = -1;
    if (dist < Math.max(105, preferred - 50)) enemyMove = 1;
    enemyX += enemyMove * MOVE_SPEED * dt;
  }

  if (dist > preferred + 150 && enemyStamina > 55 && Math.random() < 0.008 * (dt / 16)) {
    tryDash(false);
  }

  // If player is attacking, consider defending
  if (playerAttack && playerAttack.progress < 0.5 && !enemyDefending && !enemyAttack && enemyStamina > 12) {
    if (dist < BASE_REACH + playerWeapon.range + 26 && Math.random() < 0.035 * (dt / 16)) {
      enemyDefending = true;
      enemyPerfectBlockTimer = 180;
      enemyStamina -= 8;
      aiDefendTimer = 600 + Math.random() * 400;
    }
  }

  // Stop defending after timer
  if (enemyDefending) {
    aiDefendTimer -= dt;
    if (aiDefendTimer <= 0) {
      enemyDefending = false;
      aiDefendTimer = 0;
    }
  }

  // Attack decision
  if (aiDecisionTimer > 300 + Math.random() * 560) {
    aiDecisionTimer = 0;

    if (!enemyAttack && !enemyDefending && dist < BASE_REACH + enemyWeapon.range + 34) {
      if (Math.random() < 0.64) startEnemyAttack();
    }
  }

  // Update enemy attack animation
  if (enemyAttack) {
    enemyAttack.progress += enemyWeapon.swingSpeed;
    if (enemyAttack.progress >= 1.0) {
      enemyAttack = null;
    }
  }
}

// ===================== MAIN GAME LOOP =====================
function update(dt) {
  if (gameState === 'GAMEOVER') {
    gameoverTimer -= dt;
    updateHitEffects(dt);
    return;
  }
  if (gameState !== 'FIGHT') return;

  gameTime += dt;
  battleMessageTimer = Math.max(0, battleMessageTimer - dt);
  comboTimer = Math.max(0, comboTimer - dt);
  if (comboTimer <= 0) playerCombo = 0;

  playerStamina = clamp(playerStamina + dt * (playerDefending ? 0.012 : 0.032), 0, 100);
  enemyStamina = clamp(enemyStamina + dt * (enemyDefending ? 0.01 : 0.028), 0, 100);
  playerPerfectBlockTimer = Math.max(0, playerPerfectBlockTimer - dt);
  enemyPerfectBlockTimer = Math.max(0, enemyPerfectBlockTimer - dt);

  if (dashQueued) {
    tryDash(true);
    dashQueued = false;
  }

  if (playerDashTimer > 0) {
    const dir = moveLeft ? -1 : 1;
    playerX += dir * DASH_SPEED * dt;
    playerDashTimer -= dt;
  } else if (!playerAttack && !playerDefending) {
    playerX += (moveRight ? 1 : 0) * MOVE_SPEED * dt;
    playerX -= (moveLeft ? 1 : 0) * MOVE_SPEED * dt;
  }

  if (enemyDashTimer > 0) {
    const dir = Math.abs(enemyX - playerX) > BASE_REACH + enemyWeapon.range ? -1 : 1;
    enemyX += dir * DASH_SPEED * dt;
    enemyDashTimer -= dt;
  }

  playerX = clamp(playerX, ARENA_LEFT, enemyX - 78);
  enemyX = clamp(enemyX, playerX + 78, ARENA_RIGHT);

  if (mouseDownLeft) startPlayerAttack();

  const wasDefending = playerDefending;
  playerDefending = mouseDownRight && !playerAttack && playerStamina > 2;
  if (playerDefending) {
    playerStamina = clamp(playerStamina - dt * 0.018, 0, 100);
    if (!wasDefending) {
      playerPerfectBlockTimer = playerWeapon.id === 'gauntlet' ? 320 : 210;
      setBattleMessage('精准格挡窗口');
    }
  }

  // Update player attack animation & hit check
  if (playerAttack) {
    playerAttack.progress += playerWeapon.swingSpeed;

    // Hit check during active frames
    if (!playerAttack.hasHit &&
        playerAttack.progress >= playerWeapon.activeStart &&
        playerAttack.progress <= playerWeapon.activeEnd) {
      if (checkHit(playerX, enemyX, playerWeapon, playerAttack.progress)) {
        const comboBonus = 1 + Math.min(0.3, playerCombo * 0.06);
        const result = applyDamage('enemy', playerWeapon, enemyDefending, enemyPerfectBlockTimer, comboBonus);
        if (result.perfect) {
          setBattleMessage('敌方完美格挡');
          playerCombo = 0;
        } else {
          playerCombo += result.blocked ? 0 : 1;
          comboTimer = 1500;
          setBattleMessage(result.blocked ? '被挡住了' : `${playerCombo} 连击`);
        }
        playerAttack.hasHit = true;
      }
    }
    if (!playerAttack.hasHit && playerAttack.progress > playerWeapon.activeEnd) {
      playerAttack.hasHit = true;
      setBattleMessage('距离不够，打空了');
    }

    if (playerAttack.progress >= 1.0) {
      playerAttack = null;
    }
  }

  // Enemy attack hit check
  if (enemyAttack && !enemyAttack.hasHit &&
      enemyAttack.progress >= enemyWeapon.activeStart &&
      enemyAttack.progress <= enemyWeapon.activeEnd) {
    if (checkHit(enemyX, playerX, enemyWeapon, enemyAttack.progress)) {
      const result = applyDamage('player', enemyWeapon, playerDefending, playerPerfectBlockTimer);
      if (result.perfect) {
        setBattleMessage('完美格挡！反击！', 1200);
        playerStamina = clamp(playerStamina + 16, 0, 100);
        lastPlayerAttackTime = Math.max(0, lastPlayerAttackTime - 320);
      } else {
        setBattleMessage(result.blocked ? '防住了部分伤害' : '被击中');
        playerCombo = 0;
      }
      enemyAttack.hasHit = true;
    }
  }
  if (enemyAttack && !enemyAttack.hasHit && enemyAttack.progress > enemyWeapon.activeEnd) {
    enemyAttack.hasHit = true;
  }

  updateAI(dt);
  playerX = clamp(playerX, ARENA_LEFT, enemyX - 78);
  enemyX = clamp(enemyX, playerX + 78, ARENA_RIGHT);
  updateHitEffects(dt);

  // Screen shake
  if (screenShake.intensity > 0.5) {
    screenShake.x = (Math.random() - 0.5) * screenShake.intensity * 2;
    screenShake.y = (Math.random() - 0.5) * screenShake.intensity * 2;
    screenShake.intensity *= 0.88;
  } else {
    screenShake.x = 0;
    screenShake.y = 0;
    screenShake.intensity = 0;
  }

  // Game over check
  if (playerHP <= 0 || enemyHP <= 0) {
    playerHP = Math.max(0, playerHP);
    enemyHP = Math.max(0, enemyHP);
    gameState = 'GAMEOVER';
    gameoverTimer = 2000; // 2秒冷却
    setBattleMessage(enemyHP <= 0 ? '胜利' : '败北', 2000);
  }
}

function render() {
  ctx.save();
  ctx.translate(screenShake.x, screenShake.y);

  drawBoxingRing();

  if (gameState === 'FIGHT' || gameState === 'GAMEOVER') {
    // Player colors - colorful/multicolored
    let playerColors = {
      head: '#44aaff', headStroke: '#2288ff',
      torso: '#ff6644', legs: '#44ff88',
      leftArm: '#ffcc00', rightArm: '#ff44ff'
    };

    // Enemy colors - purple-black
    let enemyColors = {
      head: '#6633aa', headStroke: '#441188',
      torso: '#332244', legs: '#553377',
      leftArm: '#442266', rightArm: '#6644aa'
    };

    // Draw player
    drawStickman(playerX, GROUND_Y, playerColors, true, playerWeapon,
      !!playerAttack, playerDefending, playerAttack ? playerAttack.progress : null, gameTime);

    // Draw player weapon trail
    if (playerAttack) {
      drawWeaponTrail(playerX, GROUND_Y, playerWeapon, playerAttack.progress, true);
    }

    // Draw enemy
    drawStickman(enemyX, GROUND_Y, enemyColors, false, enemyWeapon,
      !!enemyAttack, enemyDefending, enemyAttack ? enemyAttack.progress : null, gameTime);

    // Draw enemy weapon trail
    if (enemyAttack) {
      drawWeaponTrail(enemyX, GROUND_Y, enemyWeapon, enemyAttack.progress, false);
    }

    // Hit effects
    drawHitEffects();

    // HUD
    drawHUD();

    // Game over overlay
    if (gameState === 'GAMEOVER') {
      drawGameOver();
    }
  }

  ctx.restore();
}

function gameLoop(timestamp) {
  let dt = timestamp - lastTime;
  if (dt > 100) dt = 16;
  lastTime = timestamp;

  update(dt);
  render();

  requestAnimationFrame(gameLoop);
}

// ===================== INIT =====================
buildWeaponUI();
preloadWeaponImages().then(() => {
  lastTime = performance.now();
  requestAnimationFrame(gameLoop);
});
</script>
</body>
