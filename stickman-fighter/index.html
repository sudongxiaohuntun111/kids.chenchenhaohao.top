<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>火柴格斗王</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="weaponSelect">
  <img id="titleLogo" src="assets/overhaul/ui/logo.png" alt="火柴格斗王">
  <p>选择一把趁手兵器，进入彩色竞技场。</p>
  <div id="weaponGrid"></div>
</div>
<div id="gameWrap">
  <canvas id="gameCanvas" width="1000" height="600"></canvas>
  <div id="mobileControls" aria-label="战斗操作">
    <button class="control-btn" id="leftBtn" type="button"></button>
    <button class="control-btn" id="rightBtn" type="button"></button>
    <button class="control-btn" id="attackBtn" type="button">攻击</button>
    <button class="control-btn" id="blockBtn" type="button">防御</button>
    <button class="control-btn" id="dashBtn" type="button">冲刺</button>
  </div>
  <div id="gameHint">键盘：A/D 移动，J 攻击，K 防御，L 冲刺。手机直接按下方按钮。</div>
</div>
<script src="game.js"></script>
</body>
</html>
